<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10403B">
<meta name="color-scheme" content="light">
<title>금융과 미래 학습지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10403B; --teal:#127475; --teal-tint:#E9F2F0; --blue:#1C6E8C;
  --amber:#E08E0B; --amber-dk:#A96A08; --sand:#FCF4E4; --sand-ink:#7A5005;
  --red:#8C3A3A; --red-bg:#F5EFEF; --gray:#5A6B68; --line:#D3E3E0;
  --bg:#F4F8F7; --card:#FFFFFF; --ok:#127475; --ok-bg:#E3F2EE; --no:#8C3A3A; --no-bg:#F7EAEA;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* ---------- 상단 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(16,64,59,.18)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;white-space:nowrap;letter-spacing:-.01em}
.brand b{color:var(--amber)}
.chnav{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.nb{border:0;background:rgba(255,255,255,.1);color:#E6F2EF;padding:7px 13px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.nb:hover{background:rgba(255,255,255,.2)}
.nb.pick{background:var(--amber);color:#2A1A00}
.nb.slink{background:transparent;color:#BFE0D8;text-decoration:underline;font-weight:500}
.nb:disabled{opacity:.35;cursor:default}
#picker{position:fixed;inset:0;background:rgba(5,25,22,.6);z-index:60;display:none;overflow:auto;padding:24px 16px}
#picker.on{display:block}
#picker .pbox{max-width:900px;margin:0 auto;background:#fff;border-radius:18px;padding:20px 22px}
#picker h3{margin:0;font-size:20px}
#picker .u{margin-top:16px;font-size:14px;font-weight:700;color:var(--teal)}
#picker .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
#picker .it{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;font-size:15px;line-height:1.35;display:flex;gap:8px;align-items:flex-start}
#picker .it:hover{border-color:var(--teal);background:var(--teal-tint)}
#picker .it.cur{border-color:var(--amber);background:var(--sand)}
#picker .it b{color:var(--teal);white-space:nowrap}
#picker .it .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#C9D6D3;margin-top:7px}
#picker .it .dot.half{background:#F5C76B} #picker .it .dot.full{background:#2E9C84}
#picker .close{float:right;border:0;background:var(--teal-tint);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
/* 설문(투자 성향) */
.sv-q{padding:12px 0;border-top:1px dashed var(--line)}
.sv-q:first-of-type{border-top:0}
.sv-q .qt{font-weight:700;margin-bottom:8px}
.sv-opts{display:flex;flex-direction:column;gap:6px}
.sv-opts label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15.5px;background:#fff}
.sv-opts label:has(input:checked){border-color:var(--teal);background:var(--teal-tint)}
.sv-opts input{accent-color:var(--teal);margin-top:4px;width:17px;height:17px;flex:none}
.sv-opts .sc{margin-left:auto;color:var(--gray);font-size:13px;font-weight:700;white-space:nowrap}
.sv-result{margin-top:14px;border-radius:12px;padding:14px 16px;background:var(--ink);color:#fff}
.sv-result b{color:var(--amber);font-size:22px}
.sv-result p{margin:4px 0 0;color:#D8EDE9;font-size:15px}
/* 배분(포트폴리오) */
.al-row{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.al-row:first-of-type{border-top:0}
.al-row .nm{font-weight:700}
.al-row .nm small{display:block;font-weight:400;color:var(--gray);font-size:13px}
.al-row input[type=range]{width:100%;accent-color:var(--teal)}
.al-row .pc{display:flex;align-items:center;gap:4px}
.al-row .pc input{width:64px;border:2px solid var(--line);border-radius:8px;padding:5px 6px;text-align:right}
.al-bar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:#EEF3F2;margin-top:12px}
.al-bar span{display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;transition:width .2s}
.al-total{margin-top:8px;font-weight:700;font-size:15.5px}
.al-total.ok{color:var(--ok)} .al-total.no{color:var(--no)}

main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,64,59,.05)}

/* ---------- 학생 정보 ---------- */
.student{display:flex;gap:14px;align-items:end;flex-wrap:wrap}
.student label{display:flex;flex-direction:column;font-size:14px;font-weight:700;color:var(--gray);gap:4px}
.student input{border:2px solid var(--line);border-radius:10px;padding:9px 12px;font-size:17px;width:150px;background:#fff}
.student input#sName{width:180px}
.student input:focus{border-color:var(--teal);outline:none}
.student input.need{border-color:var(--red);background:var(--red-bg)}
.student .saved{margin-left:auto;font-size:14px;color:var(--gray);display:flex;align-items:center;gap:6px}
.student .saved i{width:9px;height:9px;border-radius:50%;background:#9DB5B0;display:inline-block}
.student .saved.on i{background:var(--teal)}
.student .hint{flex-basis:100%;font-size:13.5px;color:var(--gray);margin:0}

/* ---------- 차시 머리 ---------- */
.ch-head{background:var(--ink);color:#fff;border:0;padding:22px 24px}
.ch-head .kick{color:var(--amber);font-weight:700;font-size:14px;letter-spacing:.06em}
.ch-head h1{margin:2px 0 10px;font-size:28px;line-height:1.3;letter-spacing:-.02em}
.ch-head .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700}
.pill.time{background:rgba(255,255,255,.14);color:#E5F3F0}
.progress{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;font-size:14px;color:#CFE6E1}
.bar{flex:1;height:10px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--amber);border-radius:99px;transition:width .3s}

.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0;list-style:none}
.recap li{background:var(--teal-tint);border-radius:10px;padding:12px 14px;font-size:15px}
.recap li b{display:block;color:var(--teal);font-size:14px;margin-bottom:2px}
.sec-title{font-size:15px;font-weight:700;color:var(--gray);margin:0 0 10px}

.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{flex:1;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.steps li .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.steps li small{display:block;color:var(--gray);font-size:13px}
.promise{margin-top:12px;background:var(--sand);border-radius:10px;padding:10px 14px;font-size:14.5px;color:var(--sand-ink)}
.promise b{margin-right:6px}

/* ---------- 과제 ---------- */
.task{position:relative}
.task-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.task-no{flex:none;background:var(--teal);color:#fff;font-weight:700;border-radius:10px;padding:3px 11px;font-size:15px}
.task-no.ai{background:var(--amber-dk)}
.task h2{margin:0;font-size:21px;letter-spacing:-.01em}
.task .mins{margin-left:auto;font-size:14px;color:var(--gray);font-weight:700}
.task .desc{margin:2px 0 14px;color:var(--gray);font-size:15.5px}

.blank-row{padding:10px 0;border-top:1px dashed var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:6px 4px;font-size:17px}
.blank-row:first-of-type{border-top:0}
.blank-row .num{flex:none;width:26px;color:var(--teal);font-weight:700}
.blank{border:0;border-bottom:2px solid var(--teal);background:var(--teal-tint);border-radius:6px 6px 0 0;padding:4px 10px;width:170px;text-align:center;font-weight:700}
.blank:focus{outline:none;background:#D6EBE6}

.cls-row{display:grid;grid-template-columns:28px 1fr auto 28px;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.cls-row:first-of-type{border-top:0}
.cls-row .num{color:var(--teal);font-weight:700}
.cls-row select{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;min-width:150px;cursor:pointer}
.cls-row select:focus{border-color:var(--teal);outline:none}

.judge-row{padding:12px 0;border-top:1px dashed var(--line)}
.judge-row:first-of-type{border-top:0}
.judge-text{background:#F7FAF9;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:16px;white-space:pre-wrap}
.judge-ctrl{display:grid;grid-template-columns:auto 1fr 28px;gap:10px;align-items:center}
.judge-ctrl select{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;cursor:pointer}
.judge-ctrl input{border:2px solid var(--line);border-radius:10px;padding:7px 12px;background:#fff;width:100%}
.judge-ctrl input:focus,.judge-ctrl select:focus{border-color:var(--teal);outline:none}

.mark{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px}
.mark.ok{background:var(--ok-bg);color:var(--ok)}
.mark.no{background:var(--no-bg);color:var(--no)}
.is-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.is-no{border-color:var(--no)!important;background:var(--no-bg)!important}

.check-bar{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.check-msg{font-size:15px;font-weight:700}
.check-msg.ok{color:var(--ok)} .check-msg.no{color:var(--no)}

.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15.5px;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn.line{background:#fff;border:2px solid var(--teal);color:var(--teal)}
.btn.line:hover{background:var(--teal-tint)}
.btn.teal{background:var(--teal);color:#fff}
.btn.teal:hover{background:#0E5F60}
.btn.amber{background:var(--amber-dk);color:#fff}
.btn.amber:hover{background:#8F5906}
.btn.ghost{background:transparent;color:var(--gray);padding:6px 10px;font-size:14px;text-decoration:underline}
.btn.big{padding:13px 22px;font-size:17px}

/* 제미나이 상자 */
.gem{background:var(--sand);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.gem-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.gem-top b{color:var(--sand-ink)}
.gem-top .acts{margin-left:auto;display:flex;gap:8px}
.gem-prompt{background:#fff;border:1px dashed var(--amber);border-radius:10px;padding:12px 14px;font-size:15.5px;white-space:pre-wrap;line-height:1.65}
.gem-note{font-size:13.5px;color:var(--sand-ink);margin:8px 0 0}

/* 서술 */
.field{margin-top:12px}
.field label{display:block;font-weight:700;font-size:16px;margin-bottom:6px}
.field label small{font-weight:400;color:var(--gray);font-size:14px;margin-left:6px}
.field textarea,.field input[type=text],.field input[type=number]{width:100%;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;resize:vertical;line-height:1.6}
.field input[type=number]{width:140px}
.field textarea:focus,.field input:focus{border-color:var(--teal);outline:none}
.field .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--gray);margin-top:3px;min-height:18px}
.paste-tip{color:var(--amber-dk);font-weight:700}
.inline-num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inline-num .unit{font-weight:700;color:var(--gray)}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15.5px;cursor:pointer;background:#F7FAF9;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.chk input{width:20px;height:20px;accent-color:var(--teal);cursor:pointer}

/* 표 */
.tbl-wrap{overflow-x:auto}
table.in{width:100%;border-collapse:collapse;font-size:15px}
table.in th{background:var(--teal-tint);color:var(--teal);text-align:left;padding:8px 10px;font-size:14px;border:1px solid var(--line)}
table.in td{border:1px solid var(--line);padding:0}
table.in td input{width:100%;border:0;padding:9px 10px;background:transparent;min-width:70px}
table.in td input:focus{outline:2px solid var(--teal);outline-offset:-2px;background:#F2F9F7}
table.in td.rn{width:42px;text-align:center;color:var(--gray);font-weight:700;background:#F7FAF9;padding:0 4px}

/* 수요-공급 실험 */
.sim{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.sim svg{width:100%;height:auto;background:#FBFDFC;border:1px solid var(--line);border-radius:12px}
.sim-ctrl{background:#F7FAF9;border:1px solid var(--line);border-radius:12px;padding:14px}
.sim-ctrl .price{font-size:30px;font-weight:700;color:var(--ink);line-height:1.2}
.sim-ctrl .price small{font-size:15px;color:var(--gray);font-weight:700}
.sim-ctrl input[type=range]{width:100%;accent-color:var(--amber-dk);margin:10px 0 6px}
.qrow{display:flex;justify-content:space-between;font-size:15.5px;padding:4px 0}
.qrow b{font-size:18px}
.qrow.d b{color:var(--teal)} .qrow.s b{color:var(--amber-dk)}
.status{margin-top:8px;border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px}
.status.dem{background:var(--no-bg);color:var(--no)}
.status.sup{background:#E6EFF3;color:var(--blue)}
.status.eq{background:var(--ok-bg);color:var(--ok)}

/* 이해도 */
.levels{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.levels label{flex:1;min-width:160px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:15.5px;background:#fff}
.levels input{accent-color:var(--teal);width:18px;height:18px}
.levels label:has(input:checked){border-color:var(--teal);background:var(--teal-tint)}

/* 제출 */
.submit{border:2px solid var(--teal)}
.submit h2{margin:0 0 4px;font-size:21px}
.missing{margin:12px 0;padding:12px 14px;border-radius:10px;font-size:15px}
.missing.warn{background:var(--sand);color:var(--sand-ink)}
.missing.done{background:var(--ok-bg);color:var(--ok);font-weight:700}
.missing ul{margin:6px 0 0;padding-left:20px}
.dl-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.howto{margin:14px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.howto li{background:#F7FAF9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.howto li b{display:block;color:var(--teal);font-size:14.5px}
.foot-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;color:var(--gray);font-size:13.5px}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:15.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#printView{display:none}

@media (max-width:760px){
  .recap,.howto{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .cls-row{grid-template-columns:24px 1fr 28px}
  .cls-row select{grid-column:2/3}
  .judge-ctrl{grid-template-columns:1fr 28px}
  .judge-ctrl input{grid-column:1/2}
  .chnav{margin-left:0}
  .nb.slink{display:none}
  .al-row{grid-template-columns:110px 1fr 80px}
  .ch-head h1{font-size:23px}
}

/* ---------- 인쇄(PDF 저장) ---------- */
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;font-size:11pt}
  body > *:not(#printView){display:none!important}
  #printView{display:block;color:#111}
  .pv-title{font-size:17pt;font-weight:700;color:#10403B;margin:0}
  .pv-sub{font-size:12pt;color:#127475;font-weight:700;margin:2px 0 10px}
  .pv-info{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:10.5pt}
  .pv-info td{border:1px solid #B9CFCA;padding:6px 8px}
  .pv-info td.k{background:#E9F2F0;font-weight:700;width:12%;color:#10403B}
  .pv-task{break-inside:auto;margin-top:12px}
  .pv-task h2{font-size:12.5pt;margin:0 0 6px;color:#10403B;border-bottom:1.5px solid #127475;padding-bottom:3px}
  .pv-q{font-weight:700;font-size:10.5pt;margin:8px 0 3px;color:#2C3E3B;break-after:avoid}
  .pv-a{background:#F1F6F5;border:1px solid #D3E3E0;border-radius:4px;padding:6px 9px;white-space:pre-wrap;font-size:10.5pt;break-inside:avoid}
  .pv-a.empty{color:#A04040;background:#FBF1F1;border-color:#E8CFCF}
  .pv-mark{font-size:9.5pt;font-weight:700;margin-left:6px}
  .pv-mark.ok{color:#127475} .pv-mark.no{color:#8C3A3A}
  .pv-tbl{width:100%;border-collapse:collapse;font-size:10pt;margin-top:4px}
  .pv-tbl th,.pv-tbl td{border:1px solid #B9CFCA;padding:5px 7px;text-align:left}
  .pv-tbl th{background:#E9F2F0}
  .pv-foot{margin-top:16px;font-size:9pt;color:#5A6B68;border-top:1px solid #D3E3E0;padding-top:6px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">금융과 미래 <b>학습지</b></div>
    <nav class="chnav" aria-label="차시 이동">
      <button class="nb" id="chPrev" title="이전 차시" aria-label="이전 차시">‹</button>
      <button class="nb pick" id="chPick" aria-haspopup="dialog"><span id="chPickLabel">차시 고르기</span> ▾</button>
      <button class="nb" id="chNext" title="다음 차시" aria-label="다음 차시">›</button>
      <a class="nb slink" id="slLink" href="slides.html" target="_blank" rel="noopener">슬라이드 다시 보기</a>
    </nav>
  </div>
</header>

<main>
  <section class="card student" aria-label="학생 정보">
    <label>학번<input id="sId" inputmode="numeric" maxlength="6" placeholder="예: 20512" autocomplete="off"></label>
    <label>이름<input id="sName" maxlength="10" placeholder="이름" autocomplete="off"></label>
    <div class="saved" id="saved"><i></i><span>입력하면 자동으로 저장돼요</span></div>
    <p class="hint">쓴 내용은 이 크롬북 안에만 저장되고 어디에도 전송되지 않아요. 창을 닫았다 열어도 이어서 쓸 수 있어요.</p>
  </section>
  <div id="chapter"></div>
</main>

<div id="picker" role="dialog" aria-label="차시 고르기"><div class="pbox" id="pickBox"></div></div>
<div id="printView" aria-hidden="true"></div>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = s => String(s).replace(/[\s.,·()~'"’‘“”]/g, "").toLowerCase();
const filled = v => String(v == null ? "" : v).trim().length > 0;
const keyOf = (ch, ti, f) => `c${ch}.t${ti}.${f}`;

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}

function taskLabel(task, i) {
  if (task.kind === "reflect") return "마무리";
  return "과제 " + (i + 1);
}

function fieldHTML(key, f, ai) {
  const v = esc(getV(key));
  const hint = f.hint ? `<small>${esc(f.hint)}</small>` : "";
  const ctrl = f.input
    ? `<input type="text" data-k="${key}" value="${v}" placeholder="${esc(f.hint || "")}">`
    : `<textarea data-k="${key}" rows="${f.rows || 3}" ${ai ? 'data-ai="1"' : ""}>${v}</textarea>`;
  return `<div class="field"><label>${esc(f.label)}${f.input ? "" : hint}</label>${ctrl}
    ${f.input ? "" : `<div class="foot"><span class="tip"></span><span class="cnt">${String(getV(key)).length}자</span></div>`}</div>`;
}

function gemHTML(prompt, id) {
  return `<div class="gem">
    <div class="gem-top"><b>제미나이에게 이렇게 물어보세요</b>
      <div class="acts">
        <button class="btn line" data-act="copy" data-src="${id}">질문 복사</button>
        <button class="btn amber" data-act="gemini">제미나이 열기 ↗</button>
      </div></div>
    <div class="gem-prompt" id="${id}">${esc(prompt)}</div>
    <p class="gem-note">복사한 뒤 제미나이 탭에 붙여넣기(Ctrl+V) 하세요. 질문을 내 상황에 맞게 바꿔도 좋아요.</p>
  </div>`;
}

        <div class="sim-ctrl">
          <div class="price"><span data-simp>${p}</span> <small>원 (빵 1개)</small></div>
          <input type="range" min="40" max="100" step="5" value="${p}" data-k="${pk}" data-simr="${ti}" aria-label="빵 가격">
          <div class="qrow d"><span>사려는 양 (수요량)</span><b data-simd>${this.qd(p)}개</b></div>
          <div class="qrow s"><span>팔려는 양 (공급량)</span><b data-sims>${this.qs(p)}개</b></div>
          <div data-simst>${this.status(p)}</div>
        </div></div>${nums}${checkBar(ti)}${txt}`;
    },
    status(p) {
      const d = this.qd(p), s = this.qs(p);
      if (d > s) return `<div class="status dem">초과 수요 — 사려는 양이 ${d - s}개 더 많아요. 값이 오를 거예요.</div>`;
      if (d < s) return `<div class="status sup">초과 공급 — 팔려는 양이 ${s - d}개 더 많아요. 값이 내려갈 거예요.</div>`;
      return `<div class="status eq">균형! 사려는 양과 팔려는 양이 같아요.</div>`;
    },
    svg(p) {
      const X = q => 50 + q / 50 * 330, Y = v => 20 + (120 - v) / 100 * 230;
      const grid = [20,40,60,80,100,120].map(v => `<line x1="50" x2="380" y1="${Y(v)}" y2="${Y(v)}" stroke="#E4ECEA"/><text x="42" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#5A6B68">${v}</text>`).join("")
        + [0,10,20,30,40,50].map(q => `<text x="${X(q)}" y="268" text-anchor="middle" font-size="11" fill="#5A6B68">${q}</text>`).join("");
      const d = this.qd(p), s = this.qs(p);
      return `${grid}
        <line x1="50" y1="250" x2="380" y2="250" stroke="#8FA6A1"/><line x1="50" y1="20" x2="50" y2="250" stroke="#8FA6A1"/>
        <text x="215" y="285" text-anchor="middle" font-size="12" fill="#10403B" font-weight="700">수량(개)</text>
        <text x="12" y="135" text-anchor="middle" font-size="12" fill="#10403B" font-weight="700" transform="rotate(-90 12 135)">가격(원)</text>
        <line x1="${X(10)}" y1="${Y(100)}" x2="${X(40)}" y2="${Y(40)}" stroke="#127475" stroke-width="4" stroke-linecap="round"/>
        <line x1="${X(10)}" y1="${Y(40)}" x2="${X(40)}" y2="${Y(100)}" stroke="#A96A08" stroke-width="4" stroke-linecap="round"/>
        <text x="${X(41)}" y="${Y(38)}" font-size="13" fill="#127475" font-weight="700">수요</text>
        <text x="${X(41)}" y="${Y(102)}" font-size="13" fill="#A96A08" font-weight="700">공급</text>
        <line x1="50" x2="380" y1="${Y(p)}" y2="${Y(p)}" stroke="#10403B" stroke-dasharray="5 4" stroke-width="1.5"/>
        <circle cx="${X(d)}" cy="${Y(p)}" r="7" fill="#127475" stroke="#fff" stroke-width="2"/>
        <circle cx="${X(s)}" cy="${Y(p)}" r="7" fill="#A96A08" stroke="#fff" stroke-width="2"/>`;
    },
    grade(t, ch, ti) {
      return t.fields.filter(f => f.num).map(f => { const k = keyOf(ch, ti, f.k), v = getV(k); return { k, ok: filled(v) && +v === f.ans, empty: !filled(v) }; });
    },
    units(t, ch, ti) { return t.fields.map(f => ({ label: f.label, done: filled(getV(keyOf(ch, ti, f.k))) })); },
    rows(t, ch, ti) {
      const g = this.grade(t, ch, ti); let gi = 0;
      return t.fields.map(f => {
        const v = getV(keyOf(ch, ti, f.k));
        if (f.num) { const m = g[gi++]; return { q: f.label, a: filled(v) ? v + f.unit : "", mark: m.empty ? null : m.ok }; }
        return { q: f.label, a: v };
      });
    }
  },
  /* ---------- 설문형 자가 진단 (예: 투자 성향 테스트) ---------- */
  survey: {
    total(t, ch, ti) {
      let sum = 0, n = 0;
      t.items.forEach((it, j) => { const v = getV(keyOf(ch, ti, "q" + j)); if (filled(v)) { sum += (+v + 1); n++; } });
      return { sum, n };
    },
    band(t, sum) { return (t.bands || []).find(b => sum <= b.max) || (t.bands || [])[t.bands.length - 1]; },
    resultHTML(t, ch, ti) {
      const { sum, n } = this.total(t, ch, ti);
      if (n < t.items.length) return `<div class="sv-result" style="background:#F1F6F5;color:var(--gray)">모든 문항에 답하면 결과가 나와요 (${n} / ${t.items.length})</div>`;
      const b = this.band(t, sum);
      return `<div class="sv-result">총점 ${sum}점 · <b>${esc(b ? b.label : "")}</b>${b && b.d ? `<p>${esc(b.d)}</p>` : ""}</div>`;
    },
    render(t, ch, ti) {
      const qs = t.items.map((it, j) => {
        const k = keyOf(ch, ti, "q" + j), v = getV(k);
        return `<div class="sv-q"><div class="qt">${j + 1}. ${esc(it.q)}</div><div class="sv-opts">` + it.o.map((o, oi) =>
          `<label><input type="radio" name="${k}" data-k="${k}" data-sv="${ti}" value="${oi}" ${String(v) === String(oi) ? "checked" : ""}><span>${esc(o)}</span><span class="sc">${oi + 1}점</span></label>`).join("") + `</div></div>`;
      }).join("");
      const after = (t.after || []).map(f => fieldHTML(keyOf(ch, ti, f.k), f, false)).join("");
      return qs + `<div data-svres="${ti}">${this.resultHTML(t, ch, ti)}</div>` + after;
    },
    units(t, ch, ti) {
      return t.items.map((it, j) => ({ label: `${j + 1}번 문항`, done: filled(getV(keyOf(ch, ti, "q" + j))) }))
        .concat((t.after || []).map(f => ({ label: f.label, done: filled(getV(keyOf(ch, ti, f.k))) })));
    },
    rows(t, ch, ti) {
      const out = t.items.map((it, j) => { const v = getV(keyOf(ch, ti, "q" + j));
        return { q: `${j + 1}. ${it.q}`, a: filled(v) ? `${it.o[+v]} (${+v + 1}점)` : "" }; });
      const { sum, n } = this.total(t, ch, ti);
      if (n === t.items.length) { const b = this.band(t, sum); out.push({ q: "결과", a: `총점 ${sum}점 · ${b ? b.label : ""}` }); }
      (t.after || []).forEach(f => out.push({ q: f.label, a: getV(keyOf(ch, ti, f.k)) }));
      return out;
    }
  },
  /* ---------- 비율 배분 (예: 포트폴리오) ---------- */
  alloc: {
    COLORS: ["#127475", "#1C6E8C", "#A96A08", "#8C3A3A", "#5A6B68", "#2E9C84", "#7A5005"],
    vals(t, ch, ti) { return t.assets.map(a => { const v = +getV(keyOf(ch, ti, "a_" + a.k)); return isFinite(v) ? Math.max(0, Math.min(100, v)) : 0; }); },
    barHTML(t, ch, ti) {
      const v = this.vals(t, ch, ti), sum = v.reduce((a, b) => a + b, 0);
      const bar = t.assets.map((a, i) => v[i] > 0 ? `<span style="width:${v[i] / Math.max(100, sum) * 100}%;background:${this.COLORS[i % 7]}">${v[i] >= 8 ? esc(a.label) + " " + v[i] + "%" : ""}</span>` : "").join("");
      const msg = sum === 100 ? `<div class="al-total ok">합계 100% — 잘 나누었어요!</div>`
        : `<div class="al-total no">합계 ${sum}% — ${sum < 100 ? (100 - sum) + "%가 남았어요" : (sum - 100) + "% 넘쳤어요"}. 100%가 되도록 맞추세요.</div>`;
      return `<div class="al-bar">${bar}</div>${msg}`;
    },
    render(t, ch, ti) {
      const before = (t.before || []).map(f => fieldHTML(keyOf(ch, ti, f.k), f, false)).join("");
      const rows = t.assets.map((a, i) => { const k = keyOf(ch, ti, "a_" + a.k), v = getV(k) === "" ? 0 : getV(k);
        return `<div class="al-row"><div class="nm"><span style="color:${this.COLORS[i % 7]}">●</span> ${esc(a.label)}${a.hint ? `<small>${esc(a.hint)}</small>` : ""}</div>
          <input type="range" min="0" max="100" step="5" value="${esc(v)}" data-k="${k}" data-al="${ti}" aria-label="${esc(a.label)} 비율">
          <span class="pc"><input type="number" min="0" max="100" step="1" value="${esc(v)}" data-k="${k}" data-al="${ti}" aria-label="${esc(a.label)} 비율 숫자">%</span></div>`; }).join("");
      const after = (t.after || []).map(f => fieldHTML(keyOf(ch, ti, f.k), f, false)).join("");
      return before + `<div class="field">${rows}<div data-albar="${ti}">${this.barHTML(t, ch, ti)}</div></div>` + after;
    },
    units(t, ch, ti) {
      const sum = this.vals(t, ch, ti).reduce((a, b) => a + b, 0);
      return (t.before || []).map(f => ({ label: f.label, done: filled(getV(keyOf(ch, ti, f.k))) }))
        .concat([{ label: "비율 합계 100% 맞추기", done: sum === 100 }])
        .concat((t.after || []).map(f => ({ label: f.label, done: filled(getV(keyOf(ch, ti, f.k))) })));
    },
    rows(t, ch, ti) {
      const v = this.vals(t, ch, ti), sum = v.reduce((a, b) => a + b, 0);
      const out = (t.before || []).map(f => ({ q: f.label, a: getV(keyOf(ch, ti, f.k)) }));
      out.push({ table: true, head: [t.assetHead || "자산", "비율"], body: t.assets.map((a, i) => [a.label, v[i] + "%"]).concat([["합계", sum + "%"]]) });
      (t.after || []).forEach(f => out.push({ q: f.label, a: getV(keyOf(ch, ti, f.k)) }));
      return out;
    }
  },
  /* ---------- 마무리 ---------- */
  reflect: {
    render(t, ch, ti) {
      const k1 = keyOf(ch, ti, "line"), k2 = keyOf(ch, ti, "level"), lv = getV(k2);
      return `<div class="field"><label>오늘 배운 것을 한 문장으로<small>친구에게 설명하듯</small></label>
          <textarea data-k="${k1}" rows="2">${esc(getV(k1))}</textarea>
          <div class="foot"><span></span><span class="cnt">${String(getV(k1)).length}자</span></div></div>
        <div class="field"><label>오늘 수업, 얼마나 이해했나요?</label><div class="levels">
          ${LEVELS.map(l => `<label><input type="radio" name="${k2}" data-k="${k2}" value="${esc(l)}" ${lv === l ? "checked" : ""}>${esc(l)}</label>`).join("")}
        </div></div>`;
    },
    units(t, ch, ti) { return [{ label: "오늘 배운 것 한 문장", done: filled(getV(keyOf(ch, ti, "line"))) }, { label: "이해도", done: filled(getV(keyOf(ch, ti, "level"))) }]; },
    rows(t, ch, ti) { return [{ q: "오늘 배운 것을 한 문장으로", a: getV(keyOf(ch, ti, "line")) }, { q: "스스로 평가한 이해도", a: getV(keyOf(ch, ti, "level")) }]; }
  }
};

function checkBar(ti) {
  return `<div class="check-bar"><button class="btn line" data-act="check" data-ti="${ti}">정답 확인</button><span class="check-msg" data-msg="${ti}"></span></div>`;
}

/* =====================================================================
   5. 화면 그리기
   ===================================================================== */
const chOf = n => CH.find(c => c.n === n) || CH[0];

function chapterUnits(c) {
  return c.tasks.flatMap((t, ti) => KINDS[t.kind].units(t, c.n, ti).map(u => Object.assign(u, { task: taskLabel(t, ti) })));
}

function chStatus(c) {
  const u = chapterUnits(c), d = u.filter(x => x.done).length;
  return d === 0 ? "" : d === u.length ? "full" : "half";
}
function renderTabs() {
  const i = CH.findIndex(c => c.n === state.ui.ch);
  $("#chPickLabel").textContent = `${state.ui.ch}차시`;
  $("#chPrev").disabled = i <= 0;
  $("#chNext").disabled = i >= CH.length - 1;
  $("#slLink").href = "slides.html#ch" + state.ui.ch;
}
function openPicker() {
  let h = `<button class="close" data-pclose>닫기</button><h3>차시 고르기</h3>`;
  [1, 2, 3].forEach(u => {
    const ls = CH.filter(c => c.unit === u); if (!ls.length) return;
    h += `<div class="u">${esc(UNITS[u])}</div><div class="list">` + ls.map(c =>
      `<button class="it${c.n === state.ui.ch ? " cur" : ""}" data-ch="${c.n}"><span class="dot ${chStatus(c)}"></span><span><b>${c.n}차시</b> ${esc(c.title)}</span></button>`).join("") + `</div>`;
  });
  $("#pickBox").innerHTML = h; $("#picker").classList.add("on");
}
function closePicker() { $("#picker").classList.remove("on"); }

function renderChapter() {
  const c = chOf(state.ui.ch);
  const total = c.tasks.reduce((s, t) => s + (t.mins || 0), 0);
  const taskCards = c.tasks.map((t, ti) => {
    if (t.kind === "reflect") {
      return `<section class="card task"><div class="task-head"><span class="task-no">마무리</span><h2>오늘 수업 돌아보기</h2><span class="mins">1분</span></div>
        ${KINDS.reflect.render(t, c.n, ti)}</section>`;
    }
    const isAi = t.kind === "ai" || !!t.prompt;
    return `<section class="card task" id="task-${ti}">
      <div class="task-head"><span class="task-no ${isAi ? "ai" : ""}">${taskLabel(t, ti)}${isAi ? " · 제미나이" : ""}</span><h2>${esc(t.title)}</h2><span class="mins">약 ${t.mins}분</span></div>
      <p class="desc">${esc(t.desc)}</p>
      ${KINDS[t.kind].render(t, c.n, ti)}</section>`;
  }).join("");

  const plan = c.tasks.filter(t => t.kind !== "reflect").map((t, i) =>
    `<li><span class="n">${i + 1}</span><span>${esc(t.title)}<small>약 ${t.mins}분${(t.kind === "ai" || t.prompt) ? " · 제미나이 활용" : ""}</small></span></li>`).join("")
    + `<li><span class="n">✓</span><span>내려받아 제출<small>워드 또는 PDF → 클래스룸</small></span></li>`;

  $("#chapter").innerHTML = `
    <section class="card ch-head">
      <div class="kick">${c.n}차시 학습지</div>
      <h1>${esc(c.title)}</h1>
      <div class="meta"><span class="pill time">⏱ 약 ${total + 1}분</span>
        <div class="progress"><div class="bar"><span id="pbar"></span></div><span id="ptext"></span></div></div>
    </section>

    <section class="card">
      <p class="sec-title">오늘 배운 것</p>
      <ul class="recap">${c.recap.map(r => `<li><b>${esc(r[0])}</b>${esc(r[1])}</li>`).join("")}</ul>
    </section>

    <section class="card">
      <p class="sec-title">이렇게 진행해요</p>
      <ol class="steps">${plan}</ol>
      <div class="promise"><b>제미나이 사용 약속</b>① 이름·학번 같은 개인정보는 넣지 않기 ② 답을 그대로 옮기지 말고 내 말로 쓰기 ③ 날짜와 숫자는 한 번 더 확인하기</div>
    </section>

    ${taskCards}

    <section class="card submit" id="submit">
      <h2>다 했으면 내려받아 제출하세요</h2>
      <div id="missing"></div>
      <div class="dl-row">
        <button class="btn teal big" data-act="docx">워드 파일로 내려받기</button>
        <button class="btn line big" data-act="pdf">PDF로 저장하기</button>
      </div>
      <ol class="howto">
        <li><b>① 내려받기</b>둘 중 선생님이 정한 파일 하나를 내려받아요.</li>
        <li><b>② 파일 찾기</b>크롬북 [파일] 앱의 [내 파일 → 다운로드]에 저장돼요.</li>
        <li><b>③ 클래스룸 제출</b>과제에서 [추가 또는 만들기 → 파일]로 올리고 [제출]을 눌러요.</li>
      </ol>
      <div class="foot-tools">
        <span>PDF는 인쇄 창의 대상에서 [PDF로 저장]을 고르면 돼요.</span>
        <button class="btn ghost" data-act="clear">이 차시 답 모두 지우기</button>
      </div>
    </section>`;
  updateProgress();
}

function updateProgress() {
  const c = chOf(state.ui.ch), u = chapterUnits(c), d = u.filter(x => x.done).length;
  const pct = u.length ? Math.round(d / u.length * 100) : 0;
  const bar = $("#pbar"); if (bar) bar.style.width = pct + "%";
  const pt = $("#ptext"); if (pt) pt.textContent = `${d} / ${u.length} 완료`;
  const m = $("#missing");
  if (m) {
    const left = u.filter(x => !x.done);
    const who = [];
    if (!filled(state.student.id)) who.push("학번");
    if (!filled(state.student.name)) who.push("이름");
    if (!left.length && !who.length) {
      m.className = "missing done"; m.innerHTML = "모두 작성했어요! 내려받아 제출하세요.";
    } else {
      const groups = {};
      left.forEach(x => { (groups[x.task] = groups[x.task] || []).push(x.label); });
      const items = (who.length ? [`<li><b>맨 위</b> — ${who.join(", ")}</li>`] : [])
        .concat(Object.keys(groups).map(g => `<li><b>${esc(g)}</b> — ${groups[g].map(esc).join(", ")}</li>`));
      m.className = "missing warn";
      m.innerHTML = `아직 비어 있는 곳이 있어요 (${who.length + left.length}곳). 비워 둔 채로도 내려받을 수 있지만, 한 번 더 확인해 보세요.<ul>${items.join("")}</ul>`;
    }
  }
  renderTabs();
}

/* =====================================================================
   6. 정답 확인 표시
   ===================================================================== */
function showCheck(ti) {
  const c = chOf(state.ui.ch), t = c.tasks[ti];
  const res = KINDS[t.kind].grade(t, c.n, ti);
  res.forEach(r => {
    const el = document.querySelector(`[data-k="${CSS.escape(r.k)}"]`);
    const mk = document.querySelector(`[data-mark="${CSS.escape(r.k)}"]`);
    if (el) { el.classList.remove("is-ok", "is-no"); if (!r.empty) el.classList.add(r.ok ? "is-ok" : "is-no"); }
    if (mk) { mk.className = "mark" + (r.empty ? "" : r.ok ? " ok" : " no"); mk.textContent = r.empty ? "" : r.ok ? "✓" : "!"; }
  });
  const ok = res.filter(r => r.ok).length, empty = res.filter(r => r.empty).length;
  const msg = document.querySelector(`[data-msg="${ti}"]`);
  if (!msg) return;
  if (empty === res.length) { msg.className = "check-msg no"; msg.textContent = "먼저 답을 써 보세요."; return; }
  if (ok === res.length) { msg.className = "check-msg ok"; msg.textContent = `${res.length}개 모두 맞았어요!`; return; }
  msg.className = "check-msg no";
  msg.textContent = `${res.length}개 중 ${ok}개 맞았어요.` + (empty ? ` 빈칸 ${empty}개가 남았어요.` : " 빨간 칸을 다시 생각해 보세요.");
}
function clearMarks(el) {
  el.classList.remove("is-ok", "is-no");
  const mk = document.querySelector(`[data-mark="${CSS.escape(el.dataset.k)}"]`);
  if (mk) { mk.className = "mark"; mk.textContent = ""; }
}

/* =====================================================================
   7. 내보내기 공통 모델
   ===================================================================== */
function exportModel() {
  const c = chOf(state.ui.ch);
  return {
    ch: c.n, title: c.title,
    id: state.student.id.trim(), name: state.student.name.trim(),
    date: new Date().toLocaleDateString("ko-KR", { year:"numeric", month:"long", day:"numeric" }),
    tasks: c.tasks.map((t, ti) => ({
      head: t.kind === "reflect" ? "마무리 · 오늘 수업 돌아보기" : `${taskLabel(t, ti)}. ${t.title}`,
      rows: KINDS[t.kind].rows(t, c.n, ti)
    }))
  };
}
function fileBase(m) {
  const clean = s => String(s).replace(/[\\/:*?"<>|\s]+/g, "");
  return `금융과미래_${m.ch}차시_${clean(m.id) || "학번"}_${clean(m.name) || "이름"}`;
}
function needStudent() {
  const idEl = $("#sId"), nmEl = $("#sName");
  const miss = [];
  if (!filled(state.student.id)) { idEl.classList.add("need"); miss.push("학번"); }
  if (!filled(state.student.name)) { nmEl.classList.add("need"); miss.push("이름"); }
  if (miss.length) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    (miss[0] === "학번" ? idEl : nmEl).focus({ preventScroll: true });
    toast(`맨 위에 ${miss.join("과 ")}을 먼저 써 주세요.`);
    return true;
  }
  return false;
}

/* =====================================================================
   8. 워드(.docx) 만들기 — 외부 라이브러리 없이 직접 생성
   ===================================================================== */
const X = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
const RF = '<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕" w:cs="Malgun Gothic"/>';
function wRun(text, o = {}) {
  const pr = `<w:rPr>${RF}${o.b ? "<w:b/><w:bCs/>" : ""}${o.color ? `<w:color w:val="${o.color}"/>` : ""}${o.sz ? `<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>` : ""}</w:rPr>`;
  return String(text).split("\n").map((line, i) => `<w:r>${pr}${i ? "<w:br/>" : ""}<w:t xml:space="preserve">${X(line)}</w:t></w:r>`).join("");
}
function wPara(runs, o = {}) {
  // OOXML 순서 규칙: keepNext → pBdr → shd → spacing → ind
  const pPr = "<w:pPr>"
    + (o.keep ? "<w:keepNext/>" : "")
    + (o.box ? `<w:pBdr><w:top w:val="single" w:sz="4" w:space="4" w:color="${o.box}"/><w:left w:val="single" w:sz="4" w:space="4" w:color="${o.box}"/><w:bottom w:val="single" w:sz="4" w:space="4" w:color="${o.box}"/><w:right w:val="single" w:sz="4" w:space="4" w:color="${o.box}"/></w:pBdr>`
       : o.rule ? `<w:pBdr><w:bottom w:val="single" w:sz="10" w:space="2" w:color="127475"/></w:pBdr>` : "")
    + (o.shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>` : "")
    + `<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 80 : o.after}" w:line="300" w:lineRule="auto"/>`
    + (o.ind ? `<w:ind w:left="${o.ind}" w:right="${o.ind}"/>` : "")
    + "</w:pPr>";
  return `<w:p>${pPr}${runs}</w:p>`;
}
function wTable(rows, widths, o = {}) {
  const b = c => `<w:${c} w:val="single" w:sz="6" w:space="0" w:color="B9CFCA"/>`;
  const grid = widths.map(w => `<w:gridCol w:w="${w}"/>`).join("");
  const trs = rows.map((r, ri) => "<w:tr>" + r.map((cell, ci) => {
    const head = (o.headRow && ri === 0) || (o.keyCols && o.keyCols.includes(ci));
    return `<w:tc><w:tcPr><w:tcW w:w="${widths[ci]}" w:type="dxa"/>${head ? '<w:shd w:val="clear" w:color="auto" w:fill="E9F2F0"/>' : ""}<w:vAlign w:val="center"/></w:tcPr>`
      + wPara(wRun(cell, { b: head, color: head ? "10403B" : "222222", sz: 20 }), { after: 0 }) + "</w:tc>";
  }).join("") + "</w:tr>").join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a, c) => a + c, 0)}" w:type="dxa"/><w:tblBorders>${b("top")}${b("left")}${b("bottom")}${b("right")}${b("insideH")}${b("insideV")}</w:tblBorders><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${trs}</w:tbl>`;
}
function buildDocx(m) {
  const W = 9638; // A4 본문 폭 (twip)
  let body = "";
  body += wPara(wRun("금융과 미래 학습지", { b: true, sz: 34, color: "10403B" }), { after: 40 });
  body += wPara(wRun(`${m.ch}차시 · ${m.title}`, { b: true, sz: 24, color: "127475" }), { after: 160 });
  body += wTable([["학번", m.id, "이름", m.name, "작성일", m.date]], [1000, 1900, 1000, 2000, 1000, 2738], { keyCols: [0, 2, 4] });
  m.tasks.forEach(t => {
    body += wPara(wRun(t.head, { b: true, sz: 24, color: "10403B" }), { before: 320, after: 100, rule: true, keep: true });
    t.rows.forEach(r => {
      if (r.table) {
        if (!r.body.length) { body += wPara(wRun("(표를 작성하지 않음)", { color: "A04040", sz: 20 }), { ind: 120, shade: "FBF1F1" }); return; }
        const n = r.head.length, first = n === 2 ? 3400 : 700, rest = Math.floor((W - first) / (n - 1));
        body += wTable([r.head, ...r.body], [first, ...Array(n - 1).fill(rest)], { headRow: true });
        body += wPara("", { after: 60 });
        return;
      }
      const markRun = r.mark == null ? "" : wRun(r.mark ? "   ✓ 정답" : "   ✗ 다시 확인", { b: true, sz: 18, color: r.mark ? "127475" : "8C3A3A" });
      body += wPara(wRun(r.q, { b: true, sz: 20, color: "2C3E3B" }) + markRun, { before: 120, after: 40, keep: true });
      if (r.note) body += wPara(wRun(r.a, { sz: 18, color: "6B5A2E" }), { ind: 120, shade: "FCF4E4", after: 60 });
      else if (filled(r.a)) body += wPara(wRun(r.a, { sz: 21, color: "1A1A1A" }), { ind: 120, shade: "F1F6F5", box: "D3E3E0", after: 60 });
      else body += wPara(wRun("(작성하지 않음)", { sz: 20, color: "A04040" }), { ind: 120, shade: "FBF1F1", after: 60 });
    });
  });
  body += wPara(wRun("이 파일은 ‘금융과 미래 학습지’ 페이지에서 내려받았습니다.", { sz: 16, color: "7A8A87" }), { before: 360 });

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr>${RF}<w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="ko-KR" w:eastAsia="ko-KR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const now = new Date().toISOString().replace(/\.\d+Z$/, "Z");
  const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(`금융과 미래 ${m.ch}차시 학습지`)}</dc:title><dc:creator>${X(m.name)}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`;
  const enc = new TextEncoder();
  return zipStore([
    { name: "[Content_Types].xml", data: enc.encode(ct) },
    { name: "_rels/.rels", data: enc.encode(rels) },
    { name: "docProps/core.xml", data: enc.encode(core) },
    { name: "word/document.xml", data: enc.encode(doc) },
    { name: "word/styles.xml", data: enc.encode(styles) },
    { name: "word/_rels/document.xml.rels", data: enc.encode(docRels) },
  ], "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}

/* 최소 ZIP 작성기 (무압축 STORE) */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC_T[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files, mime) {
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosT, true); lh.setUint16(12, dosD, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true);
    lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true);
    cd.setUint16(10, 0, true); cd.setUint16(12, dosT, true); cd.setUint16(14, dosD, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, nm.length, true); cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true); cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true); end.setUint16(20, 0, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: mime });
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* =====================================================================
   9. PDF — 인쇄용 화면을 만든 뒤 브라우저 인쇄(PDF로 저장)
   ===================================================================== */
function buildPrint(m) {
  const H = esc;
  let h = `<p class="pv-title">금융과 미래 학습지</p><p class="pv-sub">${m.ch}차시 · ${H(m.title)}</p>
    <table class="pv-info"><tr><td class="k">학번</td><td>${H(m.id)}</td><td class="k">이름</td><td>${H(m.name)}</td><td class="k">작성일</td><td>${H(m.date)}</td></tr></table>`;
  m.tasks.forEach(t => {
    h += `<div class="pv-task"><h2>${H(t.head)}</h2>`;
    t.rows.forEach(r => {
      if (r.table) {
        h += r.body.length
          ? `<table class="pv-tbl"><tr>${r.head.map(c => `<th>${H(c)}</th>`).join("")}</tr>${r.body.map(row => `<tr>${row.map(c => `<td>${H(c)}</td>`).join("")}</tr>`).join("")}</table>`
          : `<div class="pv-a empty">(표를 작성하지 않음)</div>`;
        return;
      }
      const mk = r.mark == null ? "" : `<span class="pv-mark ${r.mark ? "ok" : "no"}">${r.mark ? "✓ 정답" : "✗ 다시 확인"}</span>`;
      h += `<div class="pv-q">${H(r.q)}${mk}</div>`;
      h += filled(r.a) ? `<div class="pv-a"${r.note ? ' style="background:#FCF4E4;color:#6B5A2E;font-size:9.5pt"' : ""}>${H(r.a)}</div>` : `<div class="pv-a empty">(작성하지 않음)</div>`;
    });
    h += `</div>`;
  });
  h += `<div class="pv-foot">이 파일은 ‘금융과 미래 학습지’ 페이지에서 저장했습니다.</div>`;
  return h;
}

/* =====================================================================
   10. 이벤트
   ===================================================================== */
function onField(e) {
  const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  setV(k, v);
  if (el.dataset.chk != null) clearMarks(el);
  const foot = el.closest(".field") && el.closest(".field").querySelector(".cnt");
  if (foot && el.tagName === "TEXTAREA") foot.textContent = el.value.length + "자";
  if (el.dataset.sv != null) {
    const c = chOf(state.ui.ch), ti = +el.dataset.sv, box = document.querySelector(`[data-svres="${ti}"]`);
    if (box) box.innerHTML = KINDS.survey.resultHTML(c.tasks[ti], c.n, ti);
  }
  if (el.dataset.al != null) {
    const c = chOf(state.ui.ch), ti = +el.dataset.al;
    let nv = Math.max(0, Math.min(100, Math.round(+el.value || 0)));
    if (String(nv) !== el.value && el.type === "number" && el.value !== "") { /* 범위 밖 입력 보정 */ }
    setV(k, nv);
    document.querySelectorAll(`[data-k="${CSS.escape(k)}"]`).forEach(o => { if (o !== el) o.value = nv; });
    const bar = document.querySelector(`[data-albar="${ti}"]`);
    if (bar) bar.innerHTML = KINDS.alloc.barHTML(c.tasks[ti], c.n, ti);
  }
  if (el.dataset.simr != null) {
    const p = +el.value, sim = KINDS.sim, box = el.closest(".sim");
    box.querySelector("[data-simp]").textContent = p;
    box.querySelector("[data-simd]").textContent = sim.qd(p) + "개";
    box.querySelector("[data-sims]").textContent = sim.qs(p) + "개";
    box.querySelector("[data-simst]").innerHTML = sim.status(p);
    box.querySelector("svg").innerHTML = sim.svg(p);
  }
  updateProgress();
}

document.addEventListener("input", e => {
  if (e.target.id === "sId" || e.target.id === "sName") {
    state.student[e.target.id === "sId" ? "id" : "name"] = e.target.value;
    e.target.classList.remove("need"); save(); updateProgress(); return;
  }
  onField(e);
});
document.addEventListener("change", e => { if (e.target.matches("select,input[type=radio],input[type=checkbox]")) onField(e); });

document.addEventListener("paste", e => {
  const el = e.target;
  if (!(el.tagName === "TEXTAREA" && el.dataset.ai)) return;
  const tip = el.closest(".field").querySelector(".tip");
  tip.className = "tip paste-tip";
  tip.textContent = "붙여넣었나요? 제미나이의 답은 참고만 하고, 내 말로 다시 써 보세요.";
  clearTimeout(tip._t); tip._t = setTimeout(() => { tip.textContent = ""; }, 7000);
});

let clearArmed = null;
document.addEventListener("click", e => {
  if (e.target.closest("#chPick")) { openPicker(); return; }
  if (e.target.closest("#chPrev")) { const i = CH.findIndex(c => c.n === state.ui.ch); if (i > 0) go(CH[i - 1].n); return; }
  if (e.target.closest("#chNext")) { const i = CH.findIndex(c => c.n === state.ui.ch); if (i < CH.length - 1) go(CH[i + 1].n); return; }
  const pit = e.target.closest("#picker .it");
  if (pit) { closePicker(); go(+pit.dataset.ch); return; }
  if (e.target.id === "picker" || e.target.closest("[data-pclose]")) { closePicker(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, c = chOf(state.ui.ch);

  if (act === "copy") {
    const txt = document.getElementById(b.dataset.src).textContent;
    copyText(txt).then(ok => toast(ok ? "질문을 복사했어요. 제미나이 탭에 붙여넣기(Ctrl+V) 하세요." : "복사가 안 됐어요. 질문을 직접 드래그해서 복사해 주세요."));
  }
  else if (act === "gemini") { window.open(GEMINI_URL, "gemini"); }
  else if (act === "check") { showCheck(+b.dataset.ti); }
  else if (act === "addrow") {
    const ti = +b.dataset.ti, t = c.tasks[ti], k = keyOf(c.n, ti, "_rows");
    setV(k, Math.min(t.maxRows, KINDS.table.nRows(t, c.n, ti) + 1));
    const y = window.scrollY; renderChapter(); window.scrollTo(0, y);
  }
  else if (act === "docx") {
    if (needStudent()) return;
    const m = exportModel();
    try { downloadBlob(buildDocx(m), fileBase(m) + ".docx"); toast("워드 파일을 내려받았어요. [다운로드] 폴더를 확인하세요."); }
    catch (err) { toast("파일을 만들지 못했어요. PDF로 저장해 보세요."); }
  }
  else if (act === "pdf") {
    if (needStudent()) return;
    const m = exportModel();
    $("#printView").innerHTML = buildPrint(m);
    const old = document.title; document.title = fileBase(m);
    const restore = () => { document.title = old; window.removeEventListener("afterprint", restore); };
    window.addEventListener("afterprint", restore);
    setTimeout(() => { window.print(); setTimeout(restore, 1500); }, 50);
  }
  else if (act === "clear") {
    if (clearArmed !== c.n) {
      clearArmed = c.n; b.textContent = "정말 지울까요? 한 번 더 누르면 지워져요";
      setTimeout(() => { if (clearArmed === c.n) { clearArmed = null; b.textContent = "이 차시 답 모두 지우기"; } }, 4000);
      return;
    }
    clearArmed = null;
    Object.keys(state.a).forEach(k => { if (k.startsWith(`c${c.n}.`)) delete state.a[k]; });
    save(); renderChapter(); toast(`${c.n}차시 답을 모두 지웠어요.`);
  }
});

function go(n) {
  state.ui.ch = chOf(n).n; save();
  if (location.hash !== "#ch" + state.ui.ch) history.replaceState(null, "", "#ch" + state.ui.ch);
  renderChapter(); window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#ch(\d+)$/); if (m) go(+m[1]); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closePicker(); });

/* =====================================================================
   11. 시작
   ===================================================================== */
$("#sId").value = state.student.id || "";
$("#sName").value = state.student.name || "";
(() => {
  const m = location.hash.match(/^#ch(\d+)$/);
  go(m ? +m[1] : (state.ui.ch || 1));
})();
</script>
</body>
</html>
