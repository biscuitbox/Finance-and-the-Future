<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 화면 · 금고 탈출</title>
<style>
:root{--pine:#10403B;--teal:#127475;--blue:#1C6E8C;--amber:#E08E0B;--amberdk:#A96A08;--brick:#8C3A3A;--lteal:#E9F2F0;--lamber:#FCF4E4;--ink:#1d2b29;--grey:#5f6f6c;--line:#d5e3e0;--bg:#f3f6f5}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hide{display:none!important}
.welcome{display:flex;align-items:center;gap:16px;border:3px solid var(--amber);background:var(--lamber)}
.top{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--pine);color:#fff}
.top .logo{font-weight:900;font-size:19px}.top .logo b{color:var(--amber)}
.top .sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn.amber{background:var(--amberdk)}.btn.red{background:var(--brick)}
.btn.ghost{background:transparent;border:2px solid currentColor;color:inherit}
.btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{background:#a9b9b6;cursor:not-allowed}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.side{background:#fff;border-right:1px solid var(--line);padding:18px}
.side h4{margin:18px 0 8px;color:var(--grey);font-size:13px;letter-spacing:.5px}
.cls{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink)}
.cls:hover{background:var(--lteal)}.cls.on{background:var(--teal);color:#fff}
.cls small{display:block;font-size:12px;opacity:.75}
.main{padding:24px 28px 60px;min-width:0}
.card{background:#fff;border-radius:16px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chead{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.chead h2{margin:0;font-size:24px;color:var(--pine)}
.code{font-size:34px;font-weight:900;letter-spacing:6px;color:var(--amberdk);background:var(--lamber);border-radius:12px;padding:6px 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--grey);font-size:14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sum div{background:var(--lteal);border-radius:12px;padding:12px 14px}
.sum b{display:block;font-size:26px;color:var(--pine)}
.sum span{font-size:13px;color:var(--grey)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:170px 1fr 130px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:18px;background:#eef2f1;border-radius:9px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--teal)}
.bar .t i.low{background:var(--brick)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--pine);color:#fff;padding:9px 8px;font-weight:700;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.none td{color:#a3b0ad}
.st{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.st.c{background:var(--teal);color:#fff}.st.p{background:var(--lamber);color:var(--amberdk)}.st.n{background:#eef2f1;color:#8a9895}
.lks span{display:inline-block;min-width:26px;text-align:center;border-radius:5px;margin-right:2px;font-size:12px;padding:1px 3px}
.lks .y{background:#d6efe9;color:var(--teal)}.lks .w{background:#f6dede;color:var(--brick)}.lks .e{background:#eef2f1;color:#a3b0ad}
.wr{max-width:340px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:0;border-radius:9px;padding:8px 14px;background:#e3eae8;font-weight:700;color:var(--grey)}
.tab.on{background:var(--teal);color:#fff}
.mat{overflow:auto}
.mat td,.mat th{text-align:center;padding:5px 4px;font-size:12px;min-width:30px}
.mat td.ok{background:#d6efe9;color:var(--teal);font-weight:700}
.mat td.pl{background:var(--lamber);color:var(--amberdk)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wall div{background:var(--lamber);border-radius:12px;padding:14px;line-height:1.6;font-size:15px}
.wall b{display:block;color:var(--amberdk);font-size:13px;margin-bottom:4px}
.form{display:grid;gap:10px;max-width:460px}
.form input,.form select{padding:10px 12px;border:2px solid var(--line);border-radius:10px;font-size:15px}
.hero{max-width:720px;margin:50px auto;background:#fff;border-radius:20px;padding:36px 40px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.hero h1{margin:0 0 10px;color:var(--pine)}
.hero p,.hero li{line-height:1.8;font-size:16px}
.demo{background:var(--lamber);border-left:5px solid var(--amber);padding:10px 14px;border-radius:8px;font-size:14px;color:#5b4106;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:12px;z-index:99}
.tv{position:fixed;inset:0;background:var(--pine);color:#fff;z-index:50;padding:30px 40px;overflow:auto}
.tv h1{margin:0;font-size:40px}.tv .big{font-size:120px;font-weight:900;color:var(--amber);line-height:1}
.tv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:26px}
.tv .grid div{border-radius:14px;padding:14px 8px;text-align:center;font-size:28px;font-weight:900;background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.tv .grid div.p{background:rgba(224,142,11,.3);color:#ffd27a}.tv .grid div.c{background:var(--amber);color:#2b1d02}
.tv .grid small{display:block;font-size:14px;font-weight:400}
.ghead{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ghead b.t{color:var(--pine);font-size:17px}
.gmode{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:15px}
.gmode label{cursor:pointer}
.gunit{display:flex;gap:8px;align-items:center;margin:14px 0 6px;font-weight:700;color:var(--pine);font-size:14px}
.gtiles{display:flex;flex-wrap:wrap;gap:6px}
.gt{position:relative;min-width:58px;border:2px solid #cfd8d6;border-radius:10px;background:#f1f4f3;color:#8a9895;padding:5px 6px;text-align:center;font-weight:900;font-size:18px;line-height:1.15}
.gt small{display:block;font-size:11px;font-weight:400;min-height:13px}
.gt.on{background:var(--teal);border-color:var(--teal);color:#fff}
.gt.half{background:var(--lamber);border:2px dashed var(--amberdk);color:var(--amberdk)}
.gt.sp{font-size:14px;min-width:92px}
.gt .dot{position:absolute;right:4px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;min-width:44px;padding:5px 9px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.ov{box-shadow:inset 0 -4px 0 var(--amber)}
.gleg{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--grey);margin-top:12px}
.gleg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.mat td.cl{background:#eceff0;color:#b5c0bd}
</style>
</head>
<body>
<div class="top"><div class="logo">금고 탈출 · <b>교사 화면</b></div><div class="sp"></div><a class="btn small ghost" href="index.html#preview" target="_blank" rel="noopener" style="color:#fff;text-decoration:none" title="모든 금고·보스전·스토리 게임을 순서 없이 해 보기 (기록 안 남음)">🎮 게임 미리 하기</a><a class="btn small ghost" href="guide.html" target="_blank" rel="noopener" style="color:#fff;text-decoration:none">📖 사용 설명서</a><span id="who" class="muted" style="color:#cfe6e2"></span><button class="btn small ghost hide" id="out">로그아웃</button></div>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<script src="db.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Number(n).toLocaleString("ko-KR");
const mmss = s => s == null ? "" : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
window.GAMES = {};
function GAME(d) { GAMES[d.n] = d; }
window.STORYDATA = {}; function STORY(d) { STORYDATA[d.n] = d; }
function loadStoryT(M) { return new Promise((res, rej) => { if (STORYDATA[M.n]) return res(STORYDATA[M.n]); const s = document.createElement("script"); s.src = `data/${M.file}.js`; s.onload = () => STORYDATA[M.n] ? res(STORYDATA[M.n]) : rej(); s.onerror = rej; document.head.appendChild(s); }); }
function loadGame(n) { return new Promise((res, rej) => { if (GAMES[n]) return res(GAMES[n]); const s = document.createElement("script"); s.src = `data/ch${DB.pad(n)}.js`; s.onload = () => GAMES[n] ? res(GAMES[n]) : rej(); s.onerror = rej; document.head.appendChild(s); }); }
const gameURL = () => new URL("./", location.href).href;

let U = null, T = null, classes = [], curCode = null, curCh = ([...READY, ...BOSSES.map(b => b.n), ...STORIES.map(b => b.n)].includes(+DB.LS.get("fg_t_ch", 0)) ? +DB.LS.get("fg_t_ch", 0) : READY[0]), tab = "now", recs = [], unwatch = () => {};

DB.init().then(() => DB.onAuth(async u => {
  U = u; T = u ? await DB.teacherInfo() : null;
  $("#who").textContent = u ? `${u.name || ""} ${u.email}` : "";
  $("#out").classList.toggle("hide", !u);
  if (!u) return viewLogin();
  if (!T) return viewUnregistered();
  await loadClasses(); render();
}));
$("#out").onclick = () => DB.signOut();

function viewLogin() {
  unwatch();
  $("#app").innerHTML = `<div class="hero"><h1>🔐 금고 탈출 · 교사 화면</h1>
    <p>학생들이 차시별 금고(퀴즈 방탈출)를 통과했는지, 어떤 문제를 많이 틀렸는지, 마지막 방에 무엇을 썼는지 볼 수 있어요.</p>
    ${DB.mode === "demo" ? `<div class="demo"><b>체험 모드</b>예요. Firebase 설정 전이라 기록은 이 브라우저에만 저장돼요. 예시 반(DEMO01)에 다른 학생 기록이 미리 들어 있어요.</div>` : ""}
    <p><button class="btn" id="in">${DB.mode === "demo" ? "체험 선생님으로 들어가기" : "구글 계정으로 로그인"}</button></p>
    <p class="muted">처음 쓰시는 선생님은 관리자에게 구글 이메일을 알려 등록을 받아야 해요.</p>
    <p><a href="guide.html" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700">📖 처음 쓰시나요? 그림으로 보는 사용 설명서</a></p></div>`;
  $("#in").onclick = () => DB.signIn().catch(e => toast("로그인하지 못했어요: " + (e.code || e.message)));
}
function viewUnregistered() {
  $("#app").innerHTML = `<div class="hero"><h1>아직 등록되지 않은 선생님이에요</h1>
    <p>로그인한 계정: <b>${esc(U.email)}</b></p><p>이 사이트 관리자에게 위 이메일을 알려 주시면, 관리자가 '선생님 관리'에서 등록해 드려요. 등록되면 이 화면을 새로고침하세요.</p>
    <p><a href="guide.html" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700">📖 기다리는 동안 사용 설명서 읽어 보기</a></p></div>`;
}
async function loadClasses() {
  classes = (await DB.listClasses()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!classes.find(c => c.code === curCode)) curCode = classes.length ? classes[0].code : null;
}
function render() {
  $("#app").innerHTML = `<div class="layout"><div class="side">
    <h4>내 반</h4><div id="clist"></div>
    <button class="btn small" id="newc" style="margin-top:10px">＋ 새 반 만들기</button>
    ${T.admin ? `<h4>관리자</h4><button class="cls ${curCode === "#admin" ? "on" : ""}" id="adm">👥 선생님 관리</button>` : ""}
    <h4>학생 입장 주소</h4><div class="muted" style="word-break:break-all">${esc(gameURL())}</div>
    <button class="btn small ghost" id="cp" style="margin-top:6px;color:var(--teal)">주소 복사</button>
    ${DB.mode === "demo" ? `<h4>체험 모드</h4><button class="btn small ghost" style="color:var(--brick)" id="rs">체험 기록 초기화</button>` : ""}
    <h4>수업 준비</h4><a class="btn small ghost" href="index.html#preview" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none;display:inline-block">🎮 게임 미리 하기</a><p class="muted" style="font-size:13px;margin:6px 0 14px">모든 금고·보스전·스토리 게임이 순서 없이 열려요. 기록은 남지 않아요.</p>
    <h4>도움말</h4><a class="btn small ghost" href="guide.html" target="_blank" rel="noopener" style="color:var(--teal);text-decoration:none;display:inline-block">📖 사용 설명서</a>
    </div><div class="main">${DB.LS.get("fg_t_guide_hide", false) ? "" : `<div class="card welcome" id="welcome"><div style="font-size:40px">📖</div>
      <div style="flex:1"><b style="color:var(--pine);font-size:18px">처음 쓰시나요? 그림으로 보는 사용 설명서가 있어요.</b>
      <div class="muted">로그인 → 반 만들기 → 학생 안내 → 현황 보기까지 화면 그림과 함께 차례대로 설명해요. (약 5분)</div></div>
      <a class="btn" href="guide.html" target="_blank" rel="noopener" style="text-decoration:none">설명서 열기</a><button class="btn small ghost" id="wx" style="color:var(--grey)">다시 보지 않기</button></div>`}<div id="main"></div></div></div>`;
  $("#clist").innerHTML = classes.map(c => `<button class="cls ${c.code === curCode ? "on" : ""}" data-c="${c.code}">${esc(c.name)}<small>${c.code}${c.open === false ? " · 기록 닫힘" : ""}</small></button>`).join("") || `<p class="muted">아직 반이 없어요.</p>`;
  document.querySelectorAll("#clist .cls").forEach(b => b.onclick = () => { curCode = b.dataset.c; render(); });
  $("#newc").onclick = () => { curCode = "#new"; render(); };
  if ($("#adm")) $("#adm").onclick = () => { curCode = "#admin"; render(); };
  $("#cp").onclick = () => navigator.clipboard.writeText(gameURL()).then(() => toast("복사했어요"));
  if ($("#wx")) $("#wx").onclick = () => { DB.LS.set("fg_t_guide_hide", true); $("#welcome").remove(); };
  if ($("#rs")) $("#rs").onclick = () => { if (confirm("체험 기록을 모두 지우고 처음 상태로 돌릴까요?")) { DB.resetDemo(); location.reload(); } };
  unwatch(); unwatch = () => {};
  if (curCode === "#new" || !curCode) return viewNew();
  if (curCode === "#admin") return viewAdmin();
  viewClass();
}

function viewNew() {
  $("#main").innerHTML = `<div class="card"><h2 style="margin-top:0;color:var(--pine)">새 반 만들기</h2>
    <div class="form"><label>반 이름 <input id="nn" placeholder="예: 2학년 3반" maxlength="30"></label>
    <label>학교 <input id="ns" value="${esc(T.school || "")}" maxlength="30"></label>
    <label>학생 수 (번호 고르기 칸 개수) <input id="nz" type="number" min="1" max="60" value="30"></label>
    <button class="btn" id="mk">반 만들고 코드 받기</button></div>
    <p class="muted">반 코드는 6자리로 자동으로 정해져요. 학생은 반 코드와 번호만 넣고 들어와요(이름·이메일은 받지 않아요).</p></div>`;
  $("#mk").onclick = async () => {
    const name = $("#nn").value.trim(); if (!name) return toast("반 이름을 써 주세요.");
    $("#mk").disabled = true;
    try { curCode = await DB.createClass({ name, school: $("#ns").value.trim(), size: Math.max(1, Math.min(60, +$("#nz").value || 30)) }); await loadClasses(); render(); toast("반을 만들었어요."); }
    catch (e) { toast("만들지 못했어요: " + (e.code || e.message)); $("#mk").disabled = false; }
  };
}

function viewClass() {
  const c = classes.find(x => x.code === curCode);
  $("#main").innerHTML = `<div class="card chead"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.school || "")} · 학생 ${c.size}명</div></div>
      <div><div class="muted">학생 입장 코드</div><div class="code">${c.code}</div></div>
      <div class="row" style="margin-left:auto">
        <button class="btn small ${c.open === false ? "amber" : ""}" id="op">${c.open === false ? "🔒 기록 닫힘 → 열기" : "🟢 기록 받는 중 → 닫기"}</button>
        <button class="btn small ghost" id="sz" style="color:var(--teal)">학생 수</button>
        <button class="btn small red" id="dc">반 삭제</button></div></div>
    <div class="card" id="gatec"></div>
    <div class="card"><div class="row" style="margin-bottom:12px"><label>차시 <select id="chs">${READY.map(n => `<option value="${n}" ${n === curCh ? "selected" : ""}>${n}차시 · ${esc(CHAPTERS[n - 1].t)}</option>`).join("")}<optgroup label="단원 보스전">${BOSSES.map(b => `<option value="${b.n}" ${b.n === curCh ? "selected" : ""}>👾 ${esc(b.t)} · ${esc(b.name)}</option>`).join("")}</optgroup><optgroup label="스토리 게임">${STORIES.map(b => `<option value="${b.n}" ${b.n === curCh ? "selected" : ""}>${b.icon} ${esc(b.t)} (${["", "Ⅰ", "Ⅱ", "Ⅲ"][b.u]}단원)</option>`).join("")}</optgroup></select></label>
      <div class="tabs" style="margin:0 0 0 8px">${[["now", "현황"], ["wall", "마지막 방 글"], ["all", "전 차시 한눈에"]].map(([k, t]) => `<button class="tab ${tab === k ? "on" : ""}" data-t="${k}">${t}</button>`).join("")}</div>
      <div style="margin-left:auto" class="row"><a class="btn small ghost" id="pvb" target="_blank" rel="noopener" href="index.html#preview" style="color:var(--teal);text-decoration:none" title="학생 화면에서 바로 해 보기 (기록 안 남음)">🎮 이 게임 미리 하기</a><button class="btn small" id="tvb">📺 TV에 진행판 띄우기</button><button class="btn small ghost" id="csv" style="color:var(--teal)">⬇ 엑셀(CSV)</button></div></div>
      <div id="body" class="muted">불러오는 중…</div></div>`;
  $("#op").onclick = async () => { await DB.updateClass(c.code, { open: c.open === false }); await loadClasses(); render(); };
  $("#sz").onclick = async () => { const v = prompt("학생 수 (1~60)", c.size); if (!v) return; await DB.updateClass(c.code, { size: Math.max(1, Math.min(60, +v || c.size)) }); await loadClasses(); render(); };
  $("#dc").onclick = async () => {
    const v = prompt(`'${c.name}'의 모든 기록이 지워지고 되돌릴 수 없어요.\n지우려면 반 코드 ${c.code}를 그대로 입력하세요.`);
    if (v !== c.code) return;
    await DB.deleteClass(c.code); curCode = null; await loadClasses(); render(); toast("반을 지웠어요.");
  };

const GALL = GSTAGES.flatMap(x => x.items.map(i => i.n));
/* 보스·스토리는 그 단원(스토리는 관련 차시) 금고를 모두 열 때 함께 열림 */
const gNeedMax = n => { const B0 = BOSSES.find(b => b.n === n); if (B0) return Math.max(...CHAPTERS.filter(c => c.u === B0.u).map(c => c.n)); const St = STORIES.find(b => b.n === n); return St ? Math.max(...St.chs) : n; };
const gRanges = a => { const o = []; for (let i = 0; i < a.length; i++) { let j = i; while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++; o.push(i === j ? `${a[i]}` : `${a[i]}~${a[j]}`); i = j; } return o.join(", "); };
function gSummary() {
  const ov = Object.keys(G.stu).sort();
  let t;
  if (!G.on) t = "모든 금고가 열려 있어요 (학생이 순서 없이 도전)";
  else {
    const chs = G.open.filter(n => n <= 34).sort((a, b) => a - b), sp = GALL.filter(n => n > 34 && G.open.includes(n));
    t = `열림: ${chs.length ? gRanges(chs) + "차시" : "차시 금고 없음"}${sp.length ? " · " + sp.map(n => chTitle(n)).join(", ") : ""}`;
  }
  return t + (ov.length ? ` · 학생별 설정 ${ov.length}명 (${ov.map(k => +k + "번").join(", ")})` : "");
}
function gSetStu(num, n, want) {
  const k = DB.pad(num), x = G.stu[k] || (G.stu[k] = { add: [], del: [] });
  x.add = (x.add || []).filter(v => v !== n); x.del = (x.del || []).filter(v => v !== n);
  if (want !== gateBase(G, n)) (want ? x.add : x.del).push(n);
}
function gTurnOn() { if (!G.on) { G.on = true; if (!G.open.length) G.open = GALL.slice(); toast("'선생님이 연 금고만'으로 바꿨어요"); } }
function gSave(c) {
  Object.keys(G.stu).forEach(k => { const x = G.stu[k]; if (!(x.add || []).length && !(x.del || []).length) delete G.stu[k]; });
  G.open = GALL.filter(n => G.open.includes(n));
  const snap = JSON.parse(JSON.stringify(G)), code = c.code; c.gate = snap;
  clearTimeout(gTimer);
  gTimer = setTimeout(() => DB.updateClass(code, { gate: snap }).then(() => toast("저장했어요 · 학생 화면에 바로 반영돼요")).catch(e => toast("저장하지 못했어요: " + (e.code || e.message))), 450);
  drawGate();
}
function drawGate() {
  const c = classes.find(x => x.code === curCode), box = $("#gatec"); if (!c || !box) return;
  if (gCode !== c.code) { gCode = c.code; const g0 = c.gate || {}; G = { on: !!g0.on, open: (g0.open || []).slice(), stu: JSON.parse(JSON.stringify(g0.stu || {})) }; gSel = new Set(); }
  const head = `<div class="ghead"><b class="t">🔓 금고 열기 · 진도 조절</b><span class="muted">${esc(gSummary())}</span>
    <button class="btn small ${gExp ? "ghost" : ""}" id="gx" style="margin-left:auto;${gExp ? "color:var(--teal)" : ""}">${gExp ? "접기 ▴" : "열 금고 정하기 ▾"}</button></div>`;
  if (!gExp) { box.innerHTML = head; $("#gx").onclick = () => { gExp = true; drawGate(); }; return; }
  const sel = [...gSel].sort((a, b) => a - b), cleared = (num, n) => recs.some(r => r.ch === n && +r.num === num && r.status === "cleared");
  const nSel = `<select id="gN">${CHAPTERS.map(x => `<option value="${x.n}" ${x.n === (+DB.LS.get("fg_t_gN", 0) || Math.min(curCh, 34)) ? "selected" : ""}>${x.n}차시</option>`).join("")}</select>`;
  const tile = it => {
    let cls = "", sm = "", dot = false;
    if (gScope === "all") {
      cls = gateBase(G, it.n) ? "on" : "";
      const k = recs.filter(r => r.ch === it.n && r.status === "cleared").length; sm = k ? `통과 ${k}` : "";
    } else {
      const k = sel.filter(num => gateOpen(G, num, it.n)).length;
      cls = !sel.length ? "" : k === sel.length ? "on" : k ? "half" : "";
      dot = sel.some(num => { const x = G.stu[DB.pad(num)]; return x && ((x.add || []).includes(it.n) || (x.del || []).includes(it.n)); });
      sm = sel.length === 1 ? (cleared(sel[0], it.n) ? "통과" : dot ? "학생별" : "") : sel.length ? `${k}/${sel.length}명` : "";
    }
    return `<button class="gt ${cls} ${it.sp ? "sp" : ""}" data-g="${it.n}" title="${esc(it.t)}">${dot ? `<span class="dot"></span>` : ""}${esc(it.lab)}<small>${sm}</small></button>`;
  };
  const grid = GSTAGES.map(x => `<div class="gunit">${esc(UNITS[x.u])}<button class="btn small ghost" style="color:var(--teal)" data-uo="${x.u}">이 단원 열기</button><button class="btn small ghost" style="color:var(--grey)" data-uc="${x.u}">닫기</button></div>
    <div class="gtiles">${x.items.map(tile).join("")}</div>`).join("");
  const legend = `<div class="gleg"><span><i style="background:var(--teal)"></i>열림</span><span><i style="background:#f1f4f3;border:1px solid #cfd8d6"></i>닫힘</span>${gScope === "stu" ? `<span><i style="background:var(--lamber);border:1px dashed var(--amberdk)"></i>고른 학생 가운데 일부만 열림</span><span><i style="background:var(--amber);border-radius:50%"></i>반 설정과 다르게 정한 곳</span>` : ""}<span>칸을 누르면 열고 닫혀요 · 닫아도 기록은 지워지지 않고, 이미 통과한 곳은 연습으로 다시 할 수 있어요</span></div>`;
  let bodyH;
  if (gScope === "all") {
    bodyH = `<div class="gmode"><label><input type="radio" name="gm" value="off" ${G.on ? "" : "checked"}> <b>모든 금고 열기</b> — 학생이 아무 금고나 순서 없이 도전해요 (처음 설정)</label>
      <label><input type="radio" name="gm" value="on" ${G.on ? "checked" : ""}> <b>선생님이 연 금고만</b> — 수업 진도에 맞춰 열어 줘요</label></div>
      <div class="row">${nSel}<button class="btn small" id="gUp">까지만 열기</button><button class="btn small ghost" style="color:var(--teal)" id="gAll">모두 열기</button><button class="btn small ghost" style="color:var(--brick)" id="gNone">모두 닫기</button>
      <span class="muted">보스전·스토리 게임은 그 단원(관련 차시) 금고를 모두 열 때 함께 열려요. 칸을 눌러 따로 정할 수도 있어요.</span></div>` + grid + legend;
  } else {
    const ovN = Object.keys(G.stu).map(k => +k);
    bodyH = `<p class="muted" style="margin:10px 0 0">번호를 눌러 학생을 고르세요(여러 명 가능). 결석·보충하는 학생, 진도가 빠른 학생에게 금고를 더 열어 주거나 특정 학생만 닫을 때 써요. 학생별 설정은 반 전체 설정보다 앞서요.</p>
      <div class="chips">${Array.from({ length: c.size }, (_, i) => i + 1).map(n => `<button class="chip ${gSel.has(n) ? "on" : ""} ${ovN.includes(n) ? "ov" : ""}" data-s="${n}" title="${ovN.includes(n) ? "학생별 설정 있음" : ""}">${n}</button>`).join("")}</div>
      <div class="row"><button class="btn small ghost" style="color:var(--teal)" id="gSa">모두 고르기</button><button class="btn small ghost" style="color:var(--grey)" id="gSn">고르기 해제</button>
        ${ovN.length ? `<button class="btn small ghost" style="color:var(--amberdk)" id="gSo">학생별 설정 있는 학생 고르기 (${ovN.length}명)</button>` : ""}</div>
      ${sel.length ? `<div class="row" style="margin-top:10px"><b style="color:var(--pine)">고른 학생 ${sel.length}명</b> <span class="muted">${sel.join(", ")}번</span>${nSel}<button class="btn small" id="gUpS">까지 열어 주기</button>
        <button class="btn small ghost" style="color:var(--brick)" id="gRst">반 설정대로 되돌리기</button></div>` + grid + legend : `<p class="muted" style="margin-top:14px">학생을 고르면 그 학생에게 열린 금고가 아래에 나와요.</p>`}`;
  }
  box.innerHTML = head + `<div class="tabs" style="margin:14px 0 0">${[["all", "반 전체"], ["stu", "학생별"]].map(([k, t]) => `<button class="tab ${gScope === k ? "on" : ""}" data-gs="${k}">${t}</button>`).join("")}</div>` + bodyH;
  $("#gx").onclick = () => { gExp = false; drawGate(); };
  box.querySelectorAll("[data-gs]").forEach(b => b.onclick = () => { gScope = b.dataset.gs; drawGate(); });
  const N = () => { const v = +$("#gN").value; DB.LS.set("fg_t_gN", v); return v; };
  const upTo = n => GALL.filter(x => (x <= 34 ? x : gNeedMax(x)) <= n);
  box.querySelectorAll("[name=gm]").forEach(r => r.onchange = () => { if (r.value === "on") gTurnOn(); else G.on = false; gSave(c); });
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const n = +b.dataset.g;
    if (gScope === "all") { gTurnOn(); G.open = G.open.includes(n) ? G.open.filter(x => x !== n) : [...G.open, n]; }
    else { const want = sel.filter(num => gateOpen(G, num, n)).length !== sel.length; sel.forEach(num => gSetStu(num, n, want)); }
    gSave(c);
  });
  const unitN = u => GSTAGES.find(x => x.u === u).items.map(i => i.n);
  box.querySelectorAll("[data-uo],[data-uc]").forEach(b => b.onclick = () => {
    const open = "uo" in b.dataset, ns = unitN(+(b.dataset.uo || b.dataset.uc));
    if (gScope === "all") { gTurnOn(); G.open = open ? [...new Set([...G.open, ...ns])] : G.open.filter(x => !ns.includes(x)); }
    else sel.forEach(num => ns.forEach(n => gSetStu(num, n, open)));
    gSave(c);
  });
  if ($("#gUp")) $("#gUp").onclick = () => { const n = N(); G.on = true; G.open = upTo(n); gSave(c); };
  if ($("#gAll")) $("#gAll").onclick = () => { if (G.on) { G.open = GALL.slice(); gSave(c); } else toast("이미 모든 금고가 열려 있어요"); };
  if ($("#gNone")) $("#gNone").onclick = () => { if (!confirm("모든 금고·보스전·스토리 게임을 닫을까요? (학생별로 연 곳은 그대로예요)")) return; G.on = true; G.open = []; gSave(c); };
  box.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { const n = +b.dataset.s; gSel.has(n) ? gSel.delete(n) : gSel.add(n); drawGate(); });
  if ($("#gSa")) $("#gSa").onclick = () => { gSel = new Set(Array.from({ length: c.size }, (_, i) => i + 1)); drawGate(); };
  if ($("#gSn")) $("#gSn").onclick = () => { gSel = new Set(); drawGate(); };
  if ($("#gSo")) $("#gSo").onclick = () => { gSel = new Set(Object.keys(G.stu).map(k => +k)); drawGate(); };
  if ($("#gUpS")) $("#gUpS").onclick = () => { const n = N(), ns = upTo(n); sel.forEach(num => ns.forEach(x => gSetStu(num, x, true))); gSave(c); };
  if ($("#gRst")) $("#gRst").onclick = () => { sel.forEach(num => delete G.stu[DB.pad(num)]); gSave(c); };
}

/* TV 진행판: 번호만 보여 줌 (별·오답은 숨김) */
let tvOn = false;
function openTV(c) { tvOn = true; const d = document.createElement("div"); d.className = "tv"; d.id = "tv"; document.body.appendChild(d); d.onclick = e => { if (e.target.id === "tvx") { tvOn = false; d.remove(); } }; drawTV(); d.requestFullscreen && d.requestFullscreen().catch(() => {}); }
function drawTV() {
  const d = $("#tv"); if (!tvOn || !d) return;
  const c = classes.find(x => x.code === curCode); if (!c) return;
  const rs = recs.filter(r => r.ch === curCh), by = Object.fromEntries(rs.map(r => [+r.num, r]));
  const cl = rs.filter(r => r.status === "cleared").length, nL = GAMES[curCh] ? GAMES[curCh].locks.length : 5;
  d.innerHTML = `<div style="display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap"><div><div style="font-size:22px;color:#b9d3cf">${curCh > 37 ? (STORIES.find(b => b.n === curCh) || { icon: "🎒" }).icon + " " + esc(chTitle(curCh)) : curCh > 34 ? "👾 " + esc(chTitle(curCh)) : curCh + "차시 금고 · " + esc(CHAPTERS[curCh - 1].t)}</div><h1>금고 탈출 진행판</h1>
    <div style="font-size:22px;margin-top:8px">반 코드 <b style="color:#ffd27a;letter-spacing:4px">${c.code}</b></div></div>
    <div style="margin-left:auto;text-align:right"><div class="big">${cl}<span style="font-size:50px;color:#fff"> / ${c.size}</span></div><div style="font-size:20px">${curCh > 37 ? "이야기 완주" : curCh > 34 ? "보스 격파" : "탈출 성공"}</div></div></div>
    <div class="grid">${Array.from({ length: c.size }, (_, i) => { const r = by[i + 1]; const k = r ? (r.status === "cleared" ? "c" : "p") : ""; return `<div class="${k}">${i + 1}<small>${k === "c" ? (curCh > 37 ? "완주!" : curCh > 34 ? "격파!" : "탈출!") : k === "p" ? (curCh > 37 ? (r.step ? r.step + "장면" : "하는 중") : curCh > 34 ? "도전 중" : `자물쇠 ${(r.locks || []).filter(l => l.ok).length}/${nL}`) : "&nbsp;"}</small></div>`; }).join("")}</div>
    <p style="margin-top:26px"><button class="btn ghost" id="tvx">닫기</button></p>`;
}

/* 관리자: 선생님 등록 */
async function viewAdmin() {
  const list = await DB.listTeachers();
  $("#main").innerHTML = `<div class="card"><h2 style="margin-top:0;color:var(--pine)">선생님 관리</h2>
    <p class="muted">여기에 등록된 구글 이메일만 반을 만들 수 있어요. 각 선생님은 자기가 만든 반의 기록만 볼 수 있어요.</p>
    <div class="form"><input id="te" placeholder="구글 이메일 (예: teacher@school.kr)"><input id="tn" placeholder="이름 (선택)"><input id="tsc" placeholder="학교 (선택)">
    <label><input type="checkbox" id="ta"> 관리자 권한도 주기</label><button class="btn" id="tadd">등록하기</button></div></div>
    <div class="card"><table><tr><th>이메일</th><th>이름</th><th>학교</th><th>권한</th><th></th></tr>
    ${list.map(t => `<tr><td>${esc(t.email)}</td><td>${esc(t.name || "")}</td><td>${esc(t.school || "")}</td><td>${t.admin ? "관리자" : "선생님"}</td><td>${t.email === U.email ? "" : `<button class="btn small ghost" style="color:var(--brick)" data-rm="${esc(t.email)}">삭제</button>`}</td></tr>`).join("")}</table></div>`;
  $("#tadd").onclick = async () => {
    const e = $("#te").value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return toast("이메일을 확인해 주세요.");
    await DB.addTeacher(e, { name: $("#tn").value.trim(), school: $("#tsc").value.trim(), admin: $("#ta").checked, addedAt: Date.now() });
    toast("등록했어요."); viewAdmin();
  };
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { if (!confirm(b.dataset.rm + " 선생님 등록을 지울까요? (그 선생님이 만든 반 기록은 남아 있어요)")) return; await DB.removeTeacher(b.dataset.rm); viewAdmin(); });
}
</script>
