<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금고 탈출 · 금융과 미래</title>
<style>
:root{--pine:#10403B;--pine2:#0b2f2b;--teal:#127475;--blue:#1C6E8C;--amber:#E08E0B;--amberdk:#A96A08;--brick:#8C3A3A;--lteal:#E9F2F0;--lamber:#FCF4E4;--ink:#1d2b29;--grey:#5f6f6c;--line:#d5e3e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--pine2);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit}
.hide{display:none!important}
#app{min-height:100%}
/* 공통 상단 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 22px;background:var(--pine);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top .logo{font-weight:900;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.top .logo b{color:var(--amber)}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:99px;padding:6px 14px;font-size:15px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:12px 22px;font-size:17px;font-weight:700;background:var(--teal);color:#fff;transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:#9fb1ae}
.btn.amber{background:var(--amberdk)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn.small{padding:7px 14px;font-size:14px;border-radius:9px}
.btn.big{padding:16px 34px;font-size:20px;border-radius:14px}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
/* 입장 */
.join{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(circle at 30% 20%,#17574f,var(--pine2) 70%)}
.joincard{background:#fff;border-radius:22px;padding:38px 40px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.joincard h1{margin:0 0 4px;font-size:30px;color:var(--pine)}
.joincard .lead{margin:0 0 26px;color:var(--grey);font-size:16px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:7px;color:var(--pine)}
.codein{width:100%;font-size:32px;letter-spacing:10px;text-align:center;font-weight:900;padding:12px;border:3px solid var(--line);border-radius:14px;text-transform:uppercase;color:var(--pine)}
.codein:focus,.numsel:focus,textarea:focus{outline:none;border-color:var(--teal)}
.numsel{width:100%;font-size:22px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:#fff}
.msg{min-height:24px;font-size:15px;color:var(--brick);margin:4px 0 0}
.msg.ok{color:var(--teal)}
.clsbox{background:var(--lteal);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:16px}
.demo{background:var(--lamber);border-left:5px solid var(--amber);padding:10px 14px;border-radius:8px;font-size:14px;color:#5b4106;margin-bottom:20px}
.tlink{display:block;text-align:center;margin-top:18px;font-size:14px;color:var(--grey)}
/* 허브 */
.hubhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px;color:#fff}
.hubhead h2{margin:0;font-size:28px}
.hubhead p{margin:4px 0 0;color:#b9d3cf}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:16px;font-weight:700}
.tab.on{background:var(--amber);color:#2b1d02}
.unit{background:#fff;border-radius:18px;padding:20px 22px;margin-bottom:18px}
.unit h3{margin:0 0 14px;color:var(--pine);font-size:19px;display:flex;align-items:center;gap:10px}
.unit h3 small{font-weight:400;color:var(--grey);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;border:0;text-align:left;border-radius:14px;padding:14px 14px 12px;min-height:108px;background:#eef2f1;color:#7b8a87;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;font-family:inherit}
.tile .no{font-size:13px;font-weight:700}
.tile .tt{font-size:15px;font-weight:700;line-height:1.3;text-align:left}
.tile .st{margin-top:auto;font-size:13px}
.tile.ready{background:var(--teal);color:#fff;box-shadow:0 6px 0 #0b5253}
.tile.ready:hover{transform:translateY(-2px)}
.tile.ready .st{color:#d9f0ee}
.tile.clear{background:var(--lamber);color:#5b4106;box-shadow:0 6px 0 #e7cf9d}
.tile.clear .stars{color:var(--amber);font-size:18px;letter-spacing:2px}
.tile.special{background:#f3ecf8;color:#6d5a7c}
.tile.special.ready{background:var(--blue);color:#fff;box-shadow:0 6px 0 #124e63}
.tile .lockic{position:absolute;right:12px;top:10px;font-size:20px;opacity:.7}
/* 도감 */
.dexsum{color:#fff;margin:-4px 0 16px;font-size:16px}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.dcard{border-radius:16px;padding:16px;min-height:170px;display:flex;flex-direction:column;gap:8px;background:#e6ecea;color:#93a29f;border:3px dashed #c4d1ce}
.dcard .dn{font-size:13px;font-weight:700}
.dcard .dq{font-size:40px;margin:auto 0;text-align:center;opacity:.5}
.dcard.got{border:4px solid var(--teal);background:#fff;color:var(--ink)}
.dcard.got.s3{border-color:var(--amber);background:linear-gradient(160deg,#fffaf0,#fcefd2)}
.dcard.got.s1{border-color:var(--blue)}
.dcard .di{font-size:36px}
.dcard .dt{font-size:19px;font-weight:900;color:var(--pine)}
.dcard .dl{font-size:14px;line-height:1.5;color:#3a4a47}
.dcard .ds{margin-top:auto;color:var(--amber);font-size:16px}
/* 게임 */
.game{display:grid;grid-template-columns:380px 1fr;gap:22px;max-width:1260px;margin:0 auto;padding:22px}
@media (max-width:960px){.game{grid-template-columns:1fr}}
.vaultpane{background:linear-gradient(170deg,#185a52,#0c3530);border-radius:22px;padding:22px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:16px}
.vaultpane h3{margin:0;font-size:18px;color:#cfe6e2;text-align:center}
.door{width:270px;height:270px;position:relative;perspective:900px}
.door svg{width:100%;height:100%;transition:transform 1.4s cubic-bezier(.6,.05,.3,1);transform-origin:8% 50%}
.door.open svg{transform:rotateY(-78deg)}
.door .inside{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle,#fff6d8,#e9b44c 60%,#8a5a07);display:flex;align-items:center;justify-content:center;font-size:70px;z-index:-1;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}
#dial{transition:transform .9s cubic-bezier(.5,0,.3,1);transform-origin:135px 135px}
.keys{display:flex;gap:8px}
.key{width:50px;height:62px;border-radius:12px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#a9c9c4}
.key b{font-size:26px;color:#fff;line-height:1.1}
.key.got{background:var(--amber);border:2px solid #ffd27a;color:#3d2a03}
.key.got b{color:#2b1d02}
.key.cur{border-color:#fff;border-style:solid}
.lockrow{display:flex;flex-direction:column;gap:6px;width:100%}
.lk{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:15px}
.lk .ic{width:28px;text-align:center}
.lk .r{margin-left:auto;font-size:13px;color:#a9c9c4}
.lk.cur{background:rgba(224,142,11,.25);outline:2px solid var(--amber)}
.lk.ok{color:#ffe1a3}
.qpane{background:#fff;border-radius:22px;padding:30px 34px;position:relative;min-height:520px;display:flex;flex-direction:column}
.qtag{display:inline-flex;align-items:center;gap:8px;background:var(--lteal);color:var(--teal);font-weight:900;border-radius:99px;padding:6px 16px;font-size:15px;align-self:flex-start}
.qtext{font-size:25px;font-weight:900;line-height:1.45;margin:16px 0 20px;color:var(--pine)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{border:3px solid var(--line);background:#fff;border-radius:14px;padding:18px;font-size:20px;font-weight:700;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--teal);background:var(--lteal)}
.opt .k{width:34px;height:34px;border-radius:50%;background:var(--lteal);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.ord{display:flex;flex-direction:column;gap:10px}
.ordi{border:3px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:19px;font-weight:700;text-align:left;display:flex;gap:14px;align-items:center;color:var(--ink)}
.ordi .k{width:36px;height:36px;border-radius:50%;background:#eef2f1;color:#9aa8a5;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.ordi.on{border-color:var(--teal);background:var(--lteal)}
.ordi.on .k{background:var(--teal);color:#fff}
.sortl{display:flex;flex-direction:column;gap:10px}
.sorti{display:flex;align-items:center;gap:12px;border:3px solid var(--line);border-radius:14px;padding:10px 12px 10px 18px;font-size:19px;font-weight:700}
.sorti .nm{flex:1}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:16px;color:var(--grey)}
.seg button.on0{background:var(--teal);border-color:var(--teal);color:#fff}
.seg button.on1{background:var(--brick);border-color:var(--brick);color:#fff}
.seg button.on2{background:var(--blue);border-color:var(--blue);color:#fff}
.seg button.on3{background:var(--amberdk);border-color:var(--amberdk);color:#fff}
@media (max-width:700px){.sorti{flex-wrap:wrap}.seg{flex-wrap:wrap}}
table.calc{border-collapse:collapse;margin:0 0 6px;font-size:20px;min-width:60%}
table.calc th{background:var(--teal);color:#fff;padding:10px 18px;font-weight:700}
table.calc td{padding:10px 18px;border-bottom:2px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.calc td:first-child{text-align:left;font-weight:700}
.tnote{font-size:14px;color:var(--grey);margin-bottom:18px}
.numrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.numin{font-size:30px;font-weight:900;width:240px;padding:10px 16px;border:3px solid var(--line);border-radius:14px;text-align:right;color:var(--pine)}
.numin:focus{outline:none;border-color:var(--teal)}
.numrow .u{font-size:22px;font-weight:700}
.submit{margin-top:22px;align-self:flex-start}
/* 결과 오버레이 */
.ov{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;gap:14px;z-index:5;animation:fadein .25s}
.ov.bad{background:rgba(140,58,58,.97);color:#fff}
.ov.good{background:rgba(255,255,255,.98)}
.ov h2{margin:0;font-size:32px}
.ov .hint{background:#fff;color:var(--ink);border-radius:14px;padding:16px 20px;font-size:18px;line-height:1.6;max-width:640px;text-align:left}
.ov .hint b{color:var(--brick)}
.ov .exp{background:var(--lteal);border-radius:14px;padding:16px 20px;font-size:18px;line-height:1.6;max-width:640px;text-align:left}
.ov .cnt{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums}
.ov .digit{display:inline-flex;align-items:center;justify-content:center;width:84px;height:100px;border-radius:16px;background:var(--amber);font-size:58px;font-weight:900;color:#2b1d02;box-shadow:0 8px 0 var(--amberdk);animation:pop .5s}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 키패드 */
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center;margin-top:10px}
.pad button{height:64px;border-radius:14px;border:0;background:var(--lteal);font-size:28px;font-weight:900;color:var(--pine)}
.pad button:hover{background:#d3e7e3}
.codeslots{display:flex;gap:10px;justify-content:center;margin:8px 0}
.codeslots span{width:62px;height:76px;border-radius:12px;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--pine)}
.codeslots span.f{border-color:var(--amber);background:var(--lamber)}
/* 마지막 방 */
.final textarea{width:100%;min-height:130px;font-size:20px;line-height:1.6;padding:16px;border:3px solid var(--line);border-radius:14px;resize:vertical}
.kws{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.kw{border-radius:99px;padding:5px 13px;font-size:15px;background:#eef2f1;color:var(--grey)}
.kw.on{background:var(--teal);color:#fff}
.meter{font-size:15px;color:var(--grey);margin-top:6px}
/* 클리어 */
.clear{max-width:900px;margin:0 auto;padding:30px 22px 60px;text-align:center;color:#fff}
.clear h1{font-size:40px;margin:10px 0 0}
.bigstars{font-size:64px;letter-spacing:10px;color:var(--amber);text-shadow:0 4px 0 #6d4704}
.bigstars .off{color:rgba(255,255,255,.18);text-shadow:none}
.stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.stat{background:rgba(255,255,255,.1);border-radius:16px;padding:14px 22px;min-width:150px}
.stat b{display:block;font-size:30px;color:#ffd27a}
.stat span{font-size:14px;color:#b9d3cf}
.flip{width:300px;height:380px;margin:20px auto;perspective:1200px}
.flip .in{position:relative;width:100%;height:100%;transition:transform 1s;transform-style:preserve-3d}
.flip.go .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;gap:12px}
.flip .f{background:repeating-linear-gradient(45deg,#127475,#127475 14px,#10403B 14px,#10403B 28px);border:6px solid #fff;font-size:70px}
.flip .b{transform:rotateY(180deg);background:#fff;color:var(--ink);border:8px solid var(--teal)}
.flip .b.s3{border-color:var(--amber);background:linear-gradient(160deg,#fffaf0,#fcefd2)}
.flip .b.s1{border-color:var(--blue)}
.flip .b .ci{font-size:64px}
.flip .b .ct{font-size:26px;font-weight:900;color:var(--pine)}
.flip .b .cl{font-size:16px;line-height:1.6}
.flip .b .cn{font-size:13px;color:var(--grey)}
.saved{font-size:15px;color:#b9d3cf;margin:6px 0 18px}
/* 보스전 */
.bosspane{background:linear-gradient(170deg,#4a2a2a,#1f1414)}
.bossface{font-size:130px;line-height:1;filter:drop-shadow(0 10px 0 rgba(0,0,0,.35));transition:transform .3s}
.bossface.hit{animation:shake .5s;filter:drop-shadow(0 0 18px #ffd27a) brightness(1.4)}
.bossface.atk{transform:scale(1.18)}
.bossface.dead{transform:rotate(-90deg) scale(.6);opacity:.35;transition:all 1s}
.hpbar{display:flex;gap:4px;width:100%}
.hpbar i{flex:1;height:20px;border-radius:5px;background:#d24d4d;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.hpbar i.off{background:rgba(255,255,255,.12);box-shadow:none}
.hplabel{display:flex;justify-content:space-between;width:100%;font-size:15px;color:#f2d6d6}
.lives{font-size:34px;letter-spacing:6px}
.bubble{background:#fff;color:var(--ink);border-radius:16px;padding:12px 18px;font-weight:700;font-size:17px;line-height:1.5;text-align:center;position:relative;width:100%}
.bubble:before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.bsrc{font-size:14px;color:var(--grey);margin-top:8px}
.tile.boss.ready{background:#8C3A3A;color:#fff;box-shadow:0 6px 0 #5e2424}
.tile.boss .prog{height:8px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden;width:100%}
.tile.boss .prog i{display:block;height:100%;background:#8C3A3A}
.dcard.got.boss{border-color:#8C3A3A;background:linear-gradient(160deg,#fff4f0,#f6dcd2)}
.dcard.got.boss.s3{border-color:var(--amber)}
.intro{max-width:860px;margin:30px auto;background:#fff;border-radius:22px;padding:36px 40px}
.intro h1{margin:6px 0 10px;color:var(--pine);font-size:32px}
.intro .story{font-size:19px;line-height:1.7;background:var(--lamber);border-radius:14px;padding:18px 22px;color:#4b3605}
.intro ul{font-size:17px;line-height:1.9;padding-left:22px;color:#33433f}
.intro .act{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.note{font-size:14px;color:var(--grey)}
.badge{display:inline-block;background:var(--amberdk);color:#fff;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;margin-left:8px;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:12px;z-index:99;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<script src="firebase-config.js"></script>
<script src="chapters.js"></script>
<script src="db.js"></script>
<script>
"use strict";
/* ============ 도우미 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => Number(n).toLocaleString("ko-KR");
const LS = DB.LS;
const R = {
  n: Math.random,
  one: a => a[Math.floor(Math.random() * a.length)],
  shuffle: a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pick: (a, k) => R.shuffle(a).slice(0, k)
};
const starsOf = f => f >= 5 ? 3 : f >= 3 ? 2 : 1;
const starTxt = (s, max = 3) => "★".repeat(s) + `<span class="off">${"★".repeat(max - s)}</span>`;
const mmss = s => `${Math.floor(s / 60)}분 ${s % 60}초`;
function toast(t, ms = 2600) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms); }
/* 효과음 (작게) */
let actx = null, muted = LS.get("fg_mute", false);
function beep(kind) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = { ok: [[660, .09], [880, .14]], bad: [[220, .18], [180, .25]], open: [[523, .1], [659, .1], [784, .1], [1047, .3]], tick: [[1200, .03]] }[kind];
    let t = actx.currentTime;
    for (const [f, d] of seq) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = kind === "bad" ? "sawtooth" : "triangle"; g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d); t += d * .9; }
  } catch (e) {}
}
/* 차시 데이터 불러오기 */
window.GAMES = {};
function GAME(d) { GAMES[d.n] = d; }
function loadGame(n) {
  return new Promise((res, rej) => {
    if (GAMES[n]) return res(GAMES[n]);
    const s = document.createElement("script");
    s.src = `data/ch${DB.pad(n)}.js`;
    s.onload = () => GAMES[n] ? res(GAMES[n]) : rej(new Error("no data"));
    s.onerror = () => rej(new Error("load fail"));
    document.head.appendChild(s);
  });
}
/* 내 정보 · 내 도감 (이 기기) */
const me = () => LS.get("fg_me", null);
const dexLocal = () => LS.get("fg_dex", {});
function dexPut(n, v) { const d = dexLocal(); d[n] = { ...(d[n] || {}), ...v }; LS.set("fg_dex", d); }

/* ============ 화면 전환 ============ */
let cleanup = () => {};
function route() {
  cleanup(); cleanup = () => {};
  const h = location.hash.slice(1);
  const m = me();
  if (!m || h === "join") return viewJoin();
  const g = h.match(/^ch(\d+)$/);
  if (g) return viewGame(+g[1]);
  const bm = h.match(/^boss(\d)$/);
  if (bm) return viewBoss(+bm[1]);
  return viewHub(h === "dex" ? "dex" : "map");
}

async function drawDex() {

function startGame(g, rec, practice) {
  const prev = (rec && rec.locks) || [];
  S = {
    g, practice, phase: "lock", cur: 0, startedAt: Date.now(), firstStart: (rec && rec.startedAt) || Date.now(),
    restarts: rec && rec.status === "playing" && !practice ? (rec.restarts || 0) + 1 : (rec && rec.restarts) || 0,
    digits: Array.from({ length: g.locks.length }, () => Math.floor(Math.random() * 10)),
    locks: g.locks.map((L, i) => {
      const p = prev[i] || {}; const tried = !practice && (p.tries || 0) > 0;
      return { prevTries: practice ? 0 : (p.tries || 0), tries: 0, wrongs: 0, prevWrongs: practice ? 0 : Math.max(0, (p.tries || 0) - (p.ok ? 1 : 0)), firstOk: tried ? !!p.firstOk : null, ok: false, v: null, used: [] };
    }),
    writing: "", saveState: practice ? "practice" : "idle", pending: null
  };
  renderGameShell();
  nextVariant(0);
  renderLock();
  save();
  const tick = setInterval(() => { const e = $("#elapsed"); if (e) e.textContent = mmss(Math.floor((Date.now() - S.startedAt) / 1000)); }, 1000);
  cleanup = () => clearInterval(tick);
}
function nextVariant(i) { S.locks[i].v = variantOf(S.g.locks[i], S.locks[i]); }
/* 자물쇠 하나에서 문제 하나 만들기. st.used: 이미 낸 pool 번호 (같은 문제가 바로 다시 나오지 않게) */
function variantOf(L, st) {
  let v;
  if (L.gen) v = L.gen(R);
  else {
    let idx = L.pool.map((_, k) => k).filter(k => !st.used.includes(k));
    if (!idx.length) { st.used = st.used.slice(-1); idx = L.pool.map((_, k) => k).filter(k => !st.used.includes(k)); }
    const k = R.one(idx); st.used.push(k);
    v = { ...L.pool[k] };
  }
  /* 보기·순서 섞기 (pool 문제와 gen 문제 모두) */
  if (v.type === "choice" && !v.opts) { const order = R.shuffle(v.options.map((_, j) => j)); v.opts = order.map(j => ({ t: v.options[j], ok: j === v.answer })); }
  if (v.type === "order" && !v.shuffled) v.shuffled = R.shuffle(v.items.map((t, j) => ({ t, j })));
  return v;
}
function renderGameShell() {
  $("#app").innerHTML = topbar(`<span class="pill">${S.g.n}차시 · ${esc(S.g.title)}${S.practice ? '<span class="badge">연습</span>' : ""}</span><span class="pill">⏱ <span id="elapsed">0분 0초</span></span><span class="pill" id="sv"></span>`) +
    `<div class="game"><div class="vaultpane"><h3>${esc(S.g.vault)}</h3>
      <div class="door" id="door"><div class="inside">📜</div>${doorSVG()}</div>
      <div class="keys" id="keys"></div><div class="lockrow" id="lockrow"></div></div>
      <div class="qpane" id="qp"></div></div>`;
  bindTop(); drawVault(); drawSave();
}
function doorSVG() {

  return `<svg viewBox="0 0 270 270"><defs><radialGradient id="dg" cx=".4" cy=".35"><stop offset="0" stop-color="#cfd8d6"/><stop offset=".7" stop-color="#8b9b98"/><stop offset="1" stop-color="#55625f"/></radialGradient></defs>
    <circle cx="135" cy="135" r="132" fill="#3d4a48"/><circle cx="135" cy="135" r="124" fill="url(#dg)" stroke="#2f3a38" stroke-width="4"/>
    <circle cx="135" cy="135" r="92" fill="none" stroke="#6f7f7c" stroke-width="3" stroke-dasharray="4 6"/>${bolts}
    <g id="dial"><circle cx="135" cy="135" r="52" fill="#2f3a38"/><circle cx="135" cy="135" r="44" fill="#E08E0B" stroke="#A96A08" stroke-width="4"/>
      ${[0, 60, 120].map(a => `<rect x="131" y="78" width="8" height="114" rx="4" fill="#A96A08" transform="rotate(${a} 135 135)"/>`).join("")}
      <circle cx="135" cy="135" r="14" fill="#10403B"/></g>
    <rect x="248" y="112" width="16" height="46" rx="5" fill="#2f3a38"/></svg>`;
}
function drawVault() {
  S.g.locks.forEach((_, i) => { const b = document.getElementById("bolt" + i); if (b) b.setAttribute("fill", S.locks[i].ok ? "#E08E0B" : "#8C3A3A"); });
  const opened = S.locks.filter(l => l.ok).length;
  const dial = document.getElementById("dial"); if (dial) dial.style.transform = `rotate(${opened * 72}deg)`;
  $("#keys").innerHTML = S.locks.map((l, i) => `<div class="key ${l.ok ? "got" : ""} ${S.phase === "lock" && i === S.cur ? "cur" : ""}">${l.ok ? `<b>${S.digits[i]}</b>` : `<b>?</b>`}${i + 1}번째</div>`).join("");
  $("#lockrow").innerHTML = S.g.locks.map((L, i) => { const l = S.locks[i];
    return `<div class="lk ${l.ok ? "ok" : ""} ${S.phase === "lock" && i === S.cur ? "cur" : ""}"><span class="ic">${l.ok ? "🔓" : L.icon || "🔒"}</span>${esc(L.title)}<span class="r">${l.ok ? (l.firstOk ? "한 번에 ✓" : "열림") : l.wrongs ? `오답 ${l.wrongs}` : ""}</span></div>`; }).join("");
}

/* --- 자물쇠 문제 --- */
function renderLock() {
  S.phase = "lock"; drawVault();
  const i = S.cur, L = S.g.locks[i], v = S.locks[i].v, qp = $("#qp");
  qp.innerHTML = `<span class="qtag">${L.icon || "🔒"} ${i + 1} / ${S.g.locks.length} · ${esc(L.title)}</span>` + qHTML(v, "자물쇠에 넣기");
  bindQ(qp, v, judge);
}
/* --- 문제 화면 그리기·채점 연결 (금고와 보스전이 함께 씀) --- */
function qHTML(v, subLabel) {
  const sub = `<button class="btn big submit" id="sub" disabled>${esc(subLabel)}</button>`;
  let body = "";
  if (v.type === "choice") body = `<div class="opts">${v.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${"ABCD"[k]}</span>${esc(o.t)}</button>`).join("")}</div>`;
  if (v.type === "order") body = `<div class="ord">${v.shuffled.map((o, k) => `<button class="ordi" data-k="${k}"><span class="k"></span>${esc(o.t)}</button>`).join("")}</div>${sub}`;
  if (v.type === "sort") body = `<div class="sortl">${v.items.map((o, k) => `<div class="sorti"><span class="nm">${esc(o.t)}</span><span class="seg">${v.bins.map((b, j) => `<button data-k="${k}" data-j="${j}">${esc(b)}</button>`).join("")}</span></div>`).join("")}</div>${sub}`;
  if (v.type === "number") body =
    `<div class="numrow"><input class="numin" id="numin" inputmode="numeric" autocomplete="off" placeholder="숫자"><span class="u">${esc(v.unit || "")}</span></div><p class="note">쉼표는 없어도 돼요. 계산기를 써도 좋아요.</p>${sub}`;
  /* 표는 모든 문제 유형에서 보여 줄 수 있음 */
  const tbl = v.table ? `<table class="calc"><tr>${v.table.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${v.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table><div class="tnote">${esc(v.table.note || "")}</div>` : "";
  return `<div class="qtext">${esc(v.q)}</div>${tbl}${body}`;
}
function bindQ(qp, v, cb) {
  if (v.type === "choice") qp.querySelectorAll(".opt").forEach(b => b.onclick = () => cb(v.opts[+b.dataset.k].ok));
  if (v.type === "order") {
    const seq = [];
    const upd = () => { qp.querySelectorAll(".ordi").forEach(b => { const p = seq.indexOf(+b.dataset.k); b.classList.toggle("on", p >= 0); b.querySelector(".k").textContent = p >= 0 ? p + 1 : ""; }); $("#sub").disabled = seq.length !== v.items.length; };
    qp.querySelectorAll(".ordi").forEach(b => b.onclick = () => { const k = +b.dataset.k, p = seq.indexOf(k); if (p >= 0) seq.splice(p, 1); else seq.push(k); beep("tick"); upd(); });
    $("#sub").onclick = () => cb(seq.every((k, p) => v.shuffled[k].j === p));
  }
  if (v.type === "sort") {
    const pick = v.items.map(() => null);
    qp.querySelectorAll(".seg button").forEach(b => b.onclick = () => { const k = +b.dataset.k, j = +b.dataset.j; pick[k] = j;
      b.parentNode.querySelectorAll("button").forEach(x => x.className = +x.dataset.j === j ? "on" + j : ""); beep("tick"); $("#sub").disabled = pick.includes(null); });
    $("#sub").onclick = () => { const wrong = v.items.filter((o, k) => o.a !== pick[k]).length; cb(wrong === 0, wrong ? `${wrong}개를 잘못 분류했어요.` : ""); };
  }
  if (v.type === "number") {
    const inp = $("#numin");
    inp.oninput = () => $("#sub").disabled = !inp.value.trim();
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) $("#sub").click(); };
    $("#sub").onclick = () => { const x = parseNum(inp.value); if (x === null) { toast("숫자로 써 주세요."); return; } cb(x === v.answer); };
    setTimeout(() => inp.focus(), 50);
  }
}
function parseNum(s) {
  s = String(s).replace(/[,\s원%개점명세년배번살]/g, "").replace(/만$/, "");
  const m = s.match(/^(\d+)억(\d*)만?$/);
  if (m) return +m[1] * 10000 + (+m[2] || 0);
  if (!/^\d+(\.\d+)?$/.test(s)) return null;
  return +s;
}
function judge(ok, extra = "") {
  const i = S.cur, st = S.locks[i], v = st.v, qp = $("#qp");
  st.tries++;
  if (ok) {
    st.ok = true; if (st.firstOk === null) st.firstOk = st.tries === 1;
    beep("ok"); drawVault(); save();
    const last = S.locks.every(l => l.ok);
    const ov = document.createElement("div"); ov.className = "ov good";
    ov.innerHTML = `<h2 style="color:var(--teal)">딸깍! 자물쇠가 열렸어요 🔓</h2>
      <div>비밀번호 <b>${i + 1}번째</b> 숫자</div><div class="digit">${S.digits[i]}</div>
      <div class="exp">💡 ${esc(v.explain || "")}</div>
      <button class="btn big amber" id="nx">${last ? "금고 비밀번호 넣기 ▶" : "다음 자물쇠 ▶"}</button>`;
    qp.appendChild(ov);
    $("#nx").onclick = () => { if (last) renderCode(); else { S.cur = S.locks.findIndex(l => !l.ok); nextVariant(S.cur); renderLock(); } };
    $("#nx").focus();
  } else {
    st.wrongs++; if (st.firstOk === null) st.firstOk = false;
    beep("bad"); save();
    qp.classList.remove("shake"); void qp.offsetWidth; qp.classList.add("shake");
    const wait = st.wrongs === 1 ? 8 : 15;
    const ov = document.createElement("div"); ov.className = "ov bad";
    ov.innerHTML = `<h2>🚨 경보! 자물쇠가 잠겼어요</h2>${extra ? `<div style="font-size:19px">${esc(extra)}</div>` : ""}
      <div class="hint"><b>힌트</b> ${esc(v.hint || "")}</div>
      <div>잠금이 풀릴 때까지</div><div class="cnt" id="cnt">${wait}</div><div style="font-size:15px;opacity:.85">풀리면 <b>다른 문제</b>가 나와요.</div>`;
    qp.appendChild(ov); drawVault();
    let t = wait;
    const iv = setInterval(() => { t--; const c = $("#cnt"); if (c) c.textContent = t; if (t <= 0) { clearInterval(iv); nextVariant(i); renderLock(); } }, 1000);
    const pc = cleanup; cleanup = () => { clearInterval(iv); pc(); };
  }
}

/* --- 금고 비밀번호 --- */
function renderCode() {
  S.phase = "code"; drawVault();
  let typed = "";
  const qp = $("#qp");
  qp.innerHTML = `<span class="qtag">🔐 금고 비밀번호</span><div class="qtext">모은 숫자 ${S.digits.length}개를 차례대로 눌러 금고를 여세요.</div>
    <div class="codeslots" id="slots"></div><div class="pad" id="pad"></div><p class="msg" id="cmsg" style="text-align:center"></p>`;
  const draw = () => { $("#slots").innerHTML = S.digits.map((_, k) => `<span class="${k < typed.length ? "f" : ""}">${k < typed.length ? typed[k] : ""}</span>`).join(""); };
  $("#pad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, "←", 0, "✓"].map(k => `<button data-k="${k}">${k}</button>`).join("");
  draw();
  const press = k => {
    if (k === "←") typed = typed.slice(0, -1);
    else if (k === "✓") { if (typed === S.digits.join("")) return openVault(); $("#cmsg").textContent = "비밀번호가 달라요. 왼쪽 열쇠 조각 순서를 확인하세요."; typed = ""; beep("bad"); }
    else if (typed.length < S.digits.length) { typed += k; beep("tick"); }
    draw();
    if (typed.length === S.digits.length && typed === S.digits.join("")) setTimeout(openVault, 250);
  };
  $("#pad").querySelectorAll("button").forEach(b => b.onclick = () => press(b.dataset.k));
  const kh = e => { if (S.phase !== "code") return; if (/^\d$/.test(e.key)) press(e.key); if (e.key === "Backspace") press("←"); };
  document.addEventListener("keydown", kh);
  const pc = cleanup; cleanup = () => { document.removeEventListener("keydown", kh); pc(); };
}
function openVault() {
  if (S.phase !== "code") return;
  S.phase = "open"; beep("open");
  $("#door").classList.add("open");
  $("#qp").innerHTML = `<div style="margin:auto;text-align:center"><div style="font-size:80px">🔓</div><div class="qtext">금고가 열렸어요!</div><p style="font-size:18px">안쪽에 마지막 방이 있어요…</p></div>`;
  setTimeout(renderFinal, 1700);
}

/* --- 마지막 방: 1~2줄 쓰기 --- */
function renderFinal() {
  S.phase = "final";
  const f = S.g.final, qp = $("#qp");
  qp.innerHTML = `<span class="qtag">📜 ${esc(f.title)}</span><div class="qtext">${esc(f.q)}</div>
    <div class="final"><textarea id="wr" maxlength="${f.max}" placeholder="여기에 써 보세요."></textarea></div>
    <div class="kws">${f.keywords.map(k => `<span class="kw" data-k="${esc(k)}">${esc(k)}</span>`).join("")}</div>
    <div class="meter" id="mt"></div><p class="note">${esc(f.tip)}</p>
    <button class="btn big amber submit" id="fs" disabled>설명서 꺼내기 (제출) ▶</button>`;
  const wr = $("#wr");
  const upd = () => {
    const t = wr.value.trim(), len = t.replace(/\s/g, "").length;
    const used = f.keywords.filter(k => t.includes(k));
    qp.querySelectorAll(".kw").forEach(s => s.classList.toggle("on", used.includes(s.dataset.k)));
    const okLen = len >= f.min, okKw = used.length > 0;
    $("#mt").innerHTML = `${okLen ? "✅" : "⬜"} ${len} / ${f.min}자 이상 · ${okKw ? "✅" : "⬜"} 오늘 배운 낱말 ${used.length}개`;
    $("#fs").disabled = !(okLen && okKw);
    S.writing = t;
  };
  wr.oninput = upd; upd(); wr.focus();
  $("#fs").onclick = finish;
}
function finish() {
  S.phase = "done";
  const firstOk = S.locks.filter(l => l.firstOk).length, stars = starsOf(firstOk);
  const sec = Math.floor((Date.now() - S.startedAt) / 1000), wrong = S.locks.reduce((a, l) => a + l.prevWrongs + l.wrongs, 0);
  S.result = { firstOk, stars, sec, wrong };
  if (!S.practice) { dexPut(S.g.n, { ...S.g.card, stars, firstOk, at: Date.now() }); save(true); }
  cleanup();
  const c = S.g.card;
  $("#app").innerHTML = topbar() + `<div class="clear">
    <div style="font-size:18px;color:#b9d3cf">${S.g.n}차시 · ${esc(S.g.title)}${S.practice ? '<span class="badge">연습</span>' : ""}</div>
    <h1>금고 탈출 성공! 🎉</h1><div class="bigstars">${starTxt(stars)}</div>
    <div class="stats"><div class="stat"><b>${firstOk} / ${S.locks.length}</b><span>한 번에 연 자물쇠</span></div><div class="stat"><b>${wrong}번</b><span>경보 (오답)</span></div><div class="stat"><b>${mmss(sec)}</b><span>걸린 시간</span></div></div>
    <div class="flip" id="flip"><div class="in"><div class="f">❓</div><div class="b s${stars}"><span class="cn">${S.g.n}차시 도감 카드</span><span class="ci">${c.icon}</span><span class="ct">${esc(c.term)}</span><span class="cl">${esc(c.line)}</span><span style="color:var(--amber);font-size:24px">${"★".repeat(stars)}</span></div></div></div>
    <p class="saved" id="savedmsg">${S.practice ? "연습이라 기록은 바뀌지 않았어요." : "기록을 보내는 중…"}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn big amber" href="#dex" style="text-decoration:none">📒 내 도감 보기</a><a class="btn big" href="#" style="text-decoration:none">🗺️ 금고 지도</a></div></div>`;
  bindTop();
  setTimeout(() => { $("#flip") && $("#flip").classList.add("go"); beep("open"); }, 700);
}

/* --- 기록 저장 (실패하면 다시 시도) --- */
function payload(final) {
  const firstOk = S.locks.filter(l => l.firstOk).length;
  const p = {
    status: final ? "cleared" : "playing",
    locks: S.locks.map(l => ({ tries: l.prevTries + l.tries, ok: l.ok, firstOk: l.firstOk === true })),
    firstOk, wrong: S.locks.reduce((a, l) => a + l.prevWrongs + l.wrongs, 0),
    restarts: S.restarts, startedAt: S.firstStart
  };
  if (final) Object.assign(p, { stars: S.result.stars, writing: S.writing, clearedAt: Date.now(), sec: S.result.sec });
  return p;
}
let saving = false, retryT = null;
function save(final) {
  if (S.practice) return;
  if (S.pending && S.pending.status === "cleared" && !final) return;
  S.pending = payload(final);
  flush();
}
async function flush() {
  if (saving || !S.pending) return;
  saving = true; S.saveState = "saving"; drawSave();
  const m = me(), data = S.pending;
  try {
    await DB.saveRecord(m.code, S.g.n, m.num, data);
    if (S.pending === data) S.pending = null;
    S.saveState = "ok";
  } catch (e) {
    if (e.message === "foreign" || e.message === "closed") { S.saveState = e.message; S.pending = null; }
    else { S.saveState = "wait"; clearTimeout(retryT); retryT = setTimeout(flush, 5000); }
  }
  saving = false; drawSave();
  if (S.pending) flush();
}
function drawSave() {
  const t = { idle: "", saving: "☁ 저장 중…", ok: "☁ 저장됨", wait: "⚠ 저장 대기 (인터넷 확인)", foreign: "⚠ 다른 기기 기록", closed: "⚠ 기록 닫힘", practice: "연습 모드" }[S.saveState] || "";
  const el = $("#sv"); if (el) el.textContent = t;
  const sm = $("#savedmsg");
  if (sm && !S.practice) sm.textContent = S.saveState === "ok" ? "✅ 선생님께 기록을 보냈어요." : S.saveState === "wait" ? "⚠ 아직 보내지 못했어요. 이 화면을 닫지 말고 인터넷 연결을 확인하세요. 자동으로 다시 보내요." : S.saveState === "foreign" ? "⚠ 이 번호는 다른 기기의 기록이 있어 보내지 못했어요. 선생님께 말씀드리세요." : S.saveState === "closed" ? "⚠ 선생님이 기록을 닫아 두어 보내지 못했어요. 선생님께 말씀드리세요." : "기록을 보내는 중…";
}
window.addEventListener("beforeunload", e => { if (S && S.pending) { e.preventDefault(); e.returnValue = ""; } });


/* ============ 단원 보스전 ============
   통과한 차시 금고의 자물쇠 문제를 섞어 냄. 맞히면 보스 체력 −1, 틀리면 목숨 −1.
   체력이 0이면 승리(보스 카드), 목숨이 0이면 패배 → 처음부터 다시. 기록은 차시 번호 35~37 */
async function viewBoss(u) {
  const B0 = BOSSES.find(b => b.u === u); if (!B0) { location.hash = ""; return; }
  const m = me();
  $("#app").innerHTML = topbar() + `<div class="wrap" style="color:#fff">보스를 부르는 중…</div>`; bindTop();
  await syncDex();
  const dex = dexLocal();
  const got = CHAPTERS.filter(c => c.u === u && dex[c.n]).map(c => c.n);
  if (got.length < B0.need) {
    $("#app").innerHTML = topbar() + `<div class="intro"><span class="qtag">${esc(B0.t)}</span><h1>${B0.icon} 아직 잠겨 있어요</h1>
      <div class="story">${esc(UNITS[u])} 금고를 <b>${B0.need}개 이상</b> 열면 ${esc(B0.name)}에게 도전할 수 있어요. 지금 <b>${got.length}개</b> 열었어요.</div>
      <div class="act"><a class="btn big" href="#" style="text-decoration:none">금고 지도로</a></div></div>`;
    bindTop(); return;
  }
  let rec = null, cls = null, offline = false;
  try { [cls, rec] = await Promise.all([DB.getClass(m.code), DB.getRecord(m.code, B0.n, m.num)]); } catch (e) { offline = true; }
  if (rec && rec._foreign) return viewBlocked({ n: B0.n }, "foreign");
  if (cls === null && !offline) return viewBlocked({ n: B0.n }, "noclass");
  const closed = cls && cls.open === false, cleared = rec && rec.status === "cleared";
  if (cleared) dexPut(B0.n, { ...B0.card, stars: rec.stars });
  const games = (await Promise.all(got.map(n => loadGame(n).catch(() => null)))).filter(Boolean);
  $("#app").innerHTML = topbar() + `<div class="intro">
    <span class="qtag">${esc(B0.t)}</span><h1>${B0.icon} ${esc(B0.name)} 등장!</h1>
    <div class="story">“${esc(B0.intro)}”</div>
    <ul><li>문제를 맞힐 때마다 보스 체력이 1씩 줄어요. <b>${B0.hp}문제</b>를 맞히면 승리!</li>
      <li>목숨은 <b>❤️ ${B0.lives}개</b>. 틀릴 때마다 하나씩 잃고, 모두 잃으면 처음부터 다시 도전해요.</li>
      <li>내가 연 금고 <b>${games.length}개</b>(${got.map(n => n + "차시").join(", ")})에서 문제가 섞여 나와요.</li>
      <li>별: 한 번도 안 틀리면 ★★★ · 1번 ★★ · 2번 ★. 이기면 <b>보스 카드</b>를 받아요.</li></ul>
    ${cleared ? `<div class="demo">이미 물리친 보스예요 (${"★".repeat(rec.stars || 1)}). 다시 하면 <b>연습</b>이라 기록은 바뀌지 않아요.</div>` : ""}
    ${closed && !cleared ? `<div class="demo">선생님이 지금은 기록을 닫아 두었어요. <b>연습</b>으로만 할 수 있어요.</div>` : ""}
    ${offline ? `<div class="demo">인터넷 연결이 불안정해요. 게임은 할 수 있고, 연결되면 기록을 다시 보내요.</div>` : ""}
    <div class="act"><button class="btn big amber" id="start">${cleared || closed ? "연습으로 도전" : "보스에게 도전"} ▶</button><a class="btn big ghost" style="color:var(--pine);text-decoration:none" href="#">금고 지도</a></div></div>`;
  bindTop();
  $("#start").onclick = () => startBoss(B0, games, rec, cleared || closed);
}
/* 차시를 돌아가며 자물쇠를 하나씩 뽑아 문제 순서를 만듦 (같은 차시가 몰리지 않게) */
/* 받침에 따라 을/를 */
const eul = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 ? "을" : "를"; };
function bossDeck(games) {
  const lists = R.shuffle(games).map(g => R.shuffle(g.locks.map((_, i) => ({ g, li: i, st: { used: [] } }))));
  const deck = [];
  for (let r = 0; lists.some(l => l[r]); r++) lists.forEach(l => { if (l[r]) deck.push(l[r]); });
  return deck;
}
function startBoss(B0, games, rec, practice) {
  const old = S && S.boss === B0 ? S : null;
  S = {
    g: { n: B0.n, title: B0.t }, boss: B0, games, practice, phase: "boss",
    hp: B0.hp, lives: B0.lives, right: 0, wrong: 0, miss: [], qi: 0,
    allMiss: practice ? [] : old ? old.allMiss.slice() : (rec && rec.status === "playing" ? (rec.miss || []).slice() : []), deck: bossDeck(games), v: null, cur: null,
    startedAt: Date.now(), firstStart: (rec && rec.startedAt) || (old && old.firstStart) || Date.now(),
    restarts: practice ? 0 : old ? old.restarts + 1 : (rec && rec.status === "playing" ? (rec.restarts || 0) + 1 : (rec && rec.restarts) || 0),
    prevWrong: practice ? 0 : old ? old.prevWrong + old.wrong : (rec && rec.status === "playing" ? rec.wrong || 0 : 0),
    saveState: practice ? "practice" : "idle", pending: null, line: B0.intro
  };
  $("#app").innerHTML = topbar(`<span class="pill">${esc(B0.t)}${practice ? '<span class="badge">연습</span>' : ""}</span><span class="pill">⏱ <span id="elapsed">0분 0초</span></span><span class="pill" id="sv"></span>`) +
    `<div class="game"><div class="vaultpane bosspane"><h3>${esc(B0.t)} · ${esc(B0.name)}</h3>
      <div class="bossface" id="bf">${B0.icon}</div><div class="bubble" id="bb"></div>
      <div class="hplabel"><span>보스 체력</span><span id="hpn"></span></div><div class="hpbar" id="hp"></div>
      <div class="lives" id="lv"></div><div style="font-size:15px;color:#f2d6d6" id="cnt"></div></div>
      <div class="qpane" id="qp"></div></div>`;
  bindTop(); drawBoss(); drawSave();
  nextBossQ();
  saveBoss(false);
  const tick = setInterval(() => { const e = $("#elapsed"); if (e) e.textContent = mmss(Math.floor((Date.now() - S.startedAt) / 1000)); }, 1000);
  cleanup = () => clearInterval(tick);
}
function drawBoss() {
  const B0 = S.boss;
  $("#hp").innerHTML = Array.from({ length: B0.hp }, (_, i) => `<i class="${i < S.hp ? "" : "off"}"></i>`).join("");
  $("#hpn").textContent = `${S.hp} / ${B0.hp}`;
  $("#lv").innerHTML = "❤️".repeat(S.lives) + "🤍".repeat(B0.lives - S.lives);
  $("#cnt").textContent = `맞힘 ${S.right} · 틀림 ${S.wrong}`;
  $("#bb").textContent = S.line;
}
function nextBossQ() {
  S.phase = "boss";
  if (S.qi >= S.deck.length) { S.deck = S.deck.concat(bossDeck(S.games)); }
  const it = S.deck[S.qi++];
  S.cur = it; S.v = variantOf(it.g.locks[it.li], it.st);
  const qp = $("#qp");
  qp.innerHTML = `<span class="qtag">⚔️ ${S.qi}번째 공격 · ${it.g.locks[it.li].icon || "🔒"} ${esc(it.g.locks[it.li].title)}</span><div class="bsrc">${it.g.n}차시 · ${esc(it.g.title)}</div>` + qHTML(S.v, "공격하기");
  bindQ(qp, S.v, judgeBoss);
}
function judgeBoss(ok, extra = "") {
  if (S.phase !== "boss") return;
  S.phase = "result";
  const B0 = S.boss, v = S.v, qp = $("#qp"), bf = $("#bf");
  if (ok) { S.hp--; S.right++; S.line = R.one(B0.hit); beep("ok"); bf.classList.remove("hit"); void bf.offsetWidth; bf.classList.add("hit"); }
  else { S.lives--; S.wrong++; S.miss.push(S.cur.g.n); S.allMiss.push(S.cur.g.n); S.line = R.one(B0.taunt); beep("bad"); bf.classList.add("atk"); setTimeout(() => bf.classList.remove("atk"), 600); qp.classList.remove("shake"); void qp.offsetWidth; qp.classList.add("shake"); }
  drawBoss(); saveBoss(false);
  const win = S.hp <= 0, lose = S.lives <= 0;
  const ov = document.createElement("div"); ov.className = "ov " + (ok ? "good" : "bad");
  ov.innerHTML = ok
    ? `<h2 style="color:var(--teal)">명중! 💥 보스 체력 −1</h2><div class="exp">💡 ${esc(v.explain || "")}</div><button class="btn big amber" id="nx">${win ? "보스를 물리쳤어요! ▶" : "다음 공격 ▶"}</button>`
    : `<h2>보스의 반격! 💔 목숨 −1</h2>${extra ? `<div style="font-size:19px">${esc(extra)}</div>` : ""}
       <div class="hint"><b>힌트</b> ${esc(v.hint || "")}</div><div class="hint"><b>풀이</b> ${esc(v.explain || "")}</div>
       <button class="btn big" id="nx" disabled style="background:#fff;color:var(--brick)">${lose ? "결과 보기" : "다음 문제"} (<span id="wt">3</span>)</button>`;
  qp.appendChild(ov);
  const go = () => { if (win) return finishBoss(); if (lose) return loseBoss(); nextBossQ(); };
  $("#nx").onclick = go;
  if (ok) $("#nx").focus();
  else { let t = 3; const iv = setInterval(() => { t--; const w = $("#wt"); if (w) w.textContent = t; if (t <= 0) { clearInterval(iv); const b = $("#nx"); if (b) { b.disabled = false; b.textContent = lose ? "결과 보기 ▶" : "다음 문제 ▶"; b.focus(); } } }, 1000);
    const pc = cleanup; cleanup = () => { clearInterval(iv); pc(); }; }
}
function loseBoss() {
  S.phase = "lost"; cleanup();
  const B0 = S.boss;
  $("#app").innerHTML = topbar() + `<div class="clear"><div style="font-size:120px">${B0.icon}</div>
    <h1>앗, 목숨을 모두 잃었어요</h1><p style="font-size:20px;color:#f2d6d6">“${esc(R.one(B0.taunt))} 다시 와 봐!”</p>
    <div class="stats"><div class="stat"><b>${S.right} / ${B0.hp}</b><span>맞힌 문제</span></div><div class="stat"><b>${B0.hp - S.right}</b><span>남은 보스 체력</span></div></div>
    <p style="color:#b9d3cf">틀린 문제의 차시: ${[...new Set(S.miss)].sort((a, b) => a - b).map(n => n + "차시").join(", ")} — 그 금고를 다시 풀어 보면 도움이 돼요.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn big amber" id="again">다시 도전 ▶</button><a class="btn big" href="#" style="text-decoration:none">🗺️ 금고 지도</a></div></div>`;
  bindTop();
  $("#again").onclick = () => startBoss(B0, S.games, null, S.practice);
}
function finishBoss() {
  S.phase = "done";
  const B0 = S.boss, stars = S.wrong === 0 ? 3 : S.wrong === 1 ? 2 : 1, sec = Math.floor((Date.now() - S.startedAt) / 1000);
  S.result = { stars, sec };
  if (!S.practice) { dexPut(B0.n, { ...B0.card, stars, at: Date.now() }); saveBoss(true); }
  cleanup();
  const c = B0.card;
  $("#app").innerHTML = topbar() + `<div class="clear">
    <div style="font-size:18px;color:#b9d3cf">${esc(B0.t)}${S.practice ? '<span class="badge">연습</span>' : ""}</div>
    <div class="bossface dead" style="margin:10px auto 0">${B0.icon}</div>
    <h1>${esc(B0.name)}${eul(B0.name)} 물리쳤어요! 🎉</h1><p style="font-size:19px;color:#f2d6d6">“${esc(B0.lose)}”</p><div class="bigstars">${starTxt(stars)}</div>
    <div class="stats"><div class="stat"><b>${S.right}</b><span>맞힌 문제</span></div><div class="stat"><b>${S.wrong}번</b><span>틀림</span></div><div class="stat"><b>${mmss(sec)}</b><span>걸린 시간</span></div></div>
    <div class="flip" id="flip"><div class="in"><div class="f">${B0.icon}</div><div class="b s${stars}" style="border-color:#8C3A3A"><span class="cn">보스 카드</span><span class="ci">${c.icon}</span><span class="ct">${esc(c.term)}</span><span class="cl">${esc(c.line)}</span><span style="color:var(--amber);font-size:24px">${"★".repeat(stars)}</span></div></div></div>
    <p class="saved" id="savedmsg">${S.practice ? "연습이라 기록은 바뀌지 않았어요." : "기록을 보내는 중…"}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn big amber" href="#dex" style="text-decoration:none">📒 내 도감 보기</a><a class="btn big" href="#" style="text-decoration:none">🗺️ 금고 지도</a></div></div>`;
  bindTop(); drawSave();
  setTimeout(() => { $("#flip") && $("#flip").classList.add("go"); beep("open"); }, 700);
}
function saveBoss(final) {
  if (S.practice) return;
  if (S.pending && S.pending.status === "cleared" && !final) return;
  const p = { status: final ? "cleared" : "playing", locks: [], firstOk: S.right, wrong: S.prevWrong + S.wrong, miss: S.allMiss.slice(-30),
    restarts: S.restarts, startedAt: S.firstStart };
  if (final) Object.assign(p, { stars: S.result.stars, clearedAt: Date.now(), sec: S.result.sec });
  S.pending = p; flush();
}

/* ============ 시작 ============ */
DB.init().then(route).catch(() => { $("#app").innerHTML = `<div class="join"><div class="joincard"><h1>연결 오류</h1><p>잠시 뒤 다시 열어 주세요.</p></div></div>`; });
</script>
</body>
</html>
